yi me ya rasa a umarninka, sannan ka daidaita prompt ɗinka na gaba.","# 8.4 Yi amfani da tsarin prompt","Tsari mai aminci shi ne Aiki + Yanayi + Masu karatu + Tsari + Buƙatu. Maimaita wannan tsari a ayyuka daban-daban.","# 8.5 Roƙi AI ya inganta aikinka","Ban da samar da sabon abun ciki, ka roƙi AI ya duba abin da ka riga ka rubuta ya ba da takamaiman shawarwarin inganta shi.","# 8.6 Roƙi AI kada ya ƙirƙiri bayanai","Ƙara umarni kamar “Kada ka ƙirƙiri gaskiya ko ƙididdiga. Ka faɗa idan ba ka da tabbas” ga duk abin da ya shafi gaskiya.","# 8.7 Sauƙaƙa Turancinka","Idan amsa ta yi wuya, ka roƙi AI ya sauƙaƙa ta, ko ya bayyana ta kamar ga mafari.","# 8.8 Ka riƙe tunaninka","Kafin ka karɓi amsar AI, ka yi tunani a taƙaice ko ta dace da fahimtarka game da lamarin.","# 8.9 Yi amfani da kayan aiki kaɗan da kyau","Maimakon gwada kowace sabuwar manhajar AI, ka zama gwani a kayan aiki ɗaya ko biyu da kake amfani da su akai-akai.","# 8.10 Gina tsarin aikin AI naka","Ƙirƙiri tsari mai maimaituwa: tsara aikin, rubuta prompt, duba daftarin, gyara sannan ka kammala.","# 8.11 Yi amfani da AI a matsaloli na gaske","Ƙwarewa na bunƙasa da sauri idan ka yi amfani da AI a matsalolin da kake fuskanta da gaske, ba kawai a atisaye ba.","# 8.12 Haɗa AI da fasahohin da kake da su","Masu amfani da AI mafi ƙwarewa ba su ne mafi zurfin ilimin fasaha ba. Su ne waɗanda ke haɗa AI da ƙarfin iliminsu a fannin nasu.","# 8.13 Ƙirƙiri ƙaramin tarin samfuran aiki","Riƙe misalan mafi kyawun aikinka da AI ya taimaka, don ka sake amfani da hanyoyin da suka yi nasara ka kuma nuna ƙwarewarka ga wasu.","# 8.14 Bibiyi sakamakonka","Lura da waɗanne prompt da hanyoyi ne ke ba da sakamako mai amfani kullum, da waɗanda ba sa yi.","# 8.15 Kada ka auna nasara da gudu kaɗai","Samar da abun ciki da sauri ba shi da amfani idan abun ciki bai daidai ba, na gama-gari ne ko ba shi da taimako.","# 8.16 Ƙalubalen inganta AI na kwana 7","Rana ta 1: gano mummunar ɗabi'a ɗaya. Rana ta 2: sake rubuta prompt ɗaya da tsarin Aiki + Yanayi + Masu karatu + Tsari. Rana ta 3: roƙi AI ya soki aikinka. Rana ta 4: sauƙaƙa bayani ɗaya. Rana ta 5: yi amfani da AI a wani aiki na kanka na gaske. Rana ta 6: duba sakamakonka da gaskiya. Rana ta 7: rubuta abin da za ka ci gaba da yi.","# 8.17 Prompt masu amfani don zama mafi kyau da AI","Gwada “Nuna duk wani rauni a wannan tsari kafin in ci gaba” ko “Yi mini tambayoyin fayyacewa uku kafin ka amsa.”","# 8.18 Gina ƙa'idojin AI naka","Rubuta gajeren jerin ƙa'idojinka, kamar kada ka bayyana kalmomin sirri, kullum ka duba da'awar gaskiya, kuma kullum ka duba kafin ka aika aiki ga wasu.","# 8.19 Mai amfani da AI mai ƙwarewa","Mai amfani da AI mai ƙwarewa na da haƙuri, yana duba aikinsa, yana kare bayanai, kuma yana ci gaba da inganta fasaharsa tare da amfani da AI.","# 8.20 Muhimman darussa","Ƙwarewa na zuwa daga kyawawan halaye, ba daga amfani da AI kullum ba. Ka rage gudu har ka iya dubawa, tunani da inganta."];
CH[8].full=["As AI becomes more common, the most valuable skills are not necessarily technical ones, but the human skills that AI cannot replace.","# 9.1 Tool vs. skill","AI is a tool. A skill is something you build over time through practice, and it remains yours even if the tool changes.","# 9.2 AI supports existing skills","AI amplifies what you already know. It rarely creates expertise out of nothing.","# 9.3 Communication skills","Clear writing, clear speaking and clear listening remain essential, whether or not AI is involved in preparing a message.","# 9.4 Problem-solving skills","Identifying the real problem behind a request is still a human responsibility that AI cannot fully take over.","# 9.5 Learning how to work with AI","Knowing how to instruct, review and correct AI output is becoming a practical skill in its own right.","# 9.6 Students and AI","Students who learn to use AI as a study assistant, rather than an answer machine, often understand their subjects more deeply.","# 9.7 Job seekers and AI","Job seekers can use AI to prepare stronger applications, but employers still value real experience, reliability and communication.","# 9.8 Small-business owners and AI","Business owners who combine AI-assisted communication with genuine customer relationships tend to build more lasting trust than those who rely on AI alone.","# 9.9 Transferable skills","Skills such as organization, discipline and honest communication transfer across every industry, with or without AI.","# 9.10 Build a skill stack","A skill stack combines two or more skills, for example agriculture plus communication plus basic AI use, to create a unique combination that is harder to replace.","# 9.11 Your existing knowledge is an asset","Whatever you already know (farming, tailoring, teaching, trading) is the foundation that AI should support, not replace.","# 9.12 Create a portfolio","Document real examples of problems you solved, with or without AI, to show your capability to schools, employers or clients.","# 9.13 Explain how AI helped","When appropriate, be able to explain clearly which parts of your work were supported by AI and which were your own judgment.","# 9.14 AI and agricultural education","Agricultural students can use AI to organize research, prepare extension materials and explain technical topics to farmers in simpler language.","# 9.15 A Nigerian agricultural education example","A final-year agricultural education student might use AI to help prepare a project report outline, then verify all data and figures against their actual field results.","# 9.16 A clothing-business skill stack","A clothing seller combining tailoring skill, customer service and AI-assisted marketing content builds a stronger business than any one skill alone.","# 9.17 Adaptability is a skill","The willingness to learn new tools as they appear, without depending entirely on any single one, is itself a valuable skill.","# 9.18 The Learn-Build-Use cycle","Learn a concept, build something small with it, and use it in a real situation, then repeat with the next concept.","# 9.19 Practical exercise: build your AI skill stack","List two skills you already have. Write down one way AI could support each of them this month.","# 9.20 Your 30-day skills plan","Choose one existing skill to strengthen and one new AI-related habit to build over the next 30 days.","# 9.21 Create your personal AI skills plan","Write down: my main skill, how AI supports it, one goal for this month, and one way I will check my progress.","# 9.22 Do not chase every new AI trend","New AI tools appear frequently. Depth in a few tools is usually more useful than shallow experimentation with many.","# 9.23 Prepare for continuous learning","Treat learning about AI as an ongoing habit, not a one-time task to finish and forget.","# 9.24 Key lessons","The future of work rewards people who combine real skills, adaptability and thoughtful AI use, not AI use alone."];HA[8].full=["Yayin da AI ke ƙara yaduwa, mafi daraja ba lallai fasahar kwamfuta ba ce, sai dabarun ɗan Adam da AI ba zai maye gurbinsu ba.","# 9.1 Kayan aiki da fasaha","AI kayan aiki ne. Fasaha abu ne da ake gina shi a kan lokaci ta hanyar aiki, kuma ya zama naka ko da kayan aikin ya canza.","# 9.2 AI na tallafa wa fasahohin da ake da su","AI na ƙara ƙarfin abin da ka riga ka sani. Da wuya ya ƙirƙiri ƙwarewa daga babu.","# 9.3 Dabarun sadarwa","Rubutu a fili, magana a fili da saurare a fili na nan da muhimmanci, ko da AI ya shiga shirya saƙo ko bai shiga ba.","# 9.4 Dabarun warware matsala","Gano ainihin matsalar da ke bayan buƙata na nan nauyin ɗan Adam da AI ba zai iya ɗauka gaba ɗaya ba.","# 9.5 Koyon yadda ake aiki da AI","Sanin yadda ake ba da umarni, dubawa da gyara sakamakon AI na zama fasaha ta aiki a kanta.","# 9.6 Ɗalibai da AI","Ɗaliban da suka koyi amfani da AI a matsayin mataimakin karatu, ba na'urar amsa ba, kan fahimci fannoninsu sosai.","# 9.7 Masu neman aiki da AI","Masu neman aiki na iya amfani da AI don shirya takardun neman aiki masu ƙarfi, amma masu aiki na daraja ƙwarewa ta gaske, amana da sadarwa.","# 9.8 Masu ƙananan sana'o'i da AI","Masu sana'a da ke haɗa sadarwar da AI ya taimaka da dangantaka ta gaske da kwastomomi kan gina amana mai ɗorewa fiye da waɗanda ke dogara da AI kaɗai.","# 9.9 Fasahohin da ake iya canjawa","Fasahohi kamar tsari, horo da sadarwa ta gaskiya na canjawa zuwa kowace masana'anta, da AI ko babu.","# 9.10 Gina tarin fasaha (skill stack)","Tarin fasaha na haɗa fasahohi biyu ko fiye, misali noma da sadarwa da ɗan amfani da AI, don ƙirƙirar haɗin da ya keɓanta kuma ya fi wuyar maye gurbinsa.","# 9.11 Iliminka na yanzu dukiya ne","Duk abin da ka riga ka sani (noma, ɗinki, koyarwa, ciniki) shi ne tushen da AI ya kamata ya tallafa masa, ba ya maye gurbinsa ba.","# 9.12 Ƙirƙiri tarin samfuran aiki","Rubuta misalan matsalolin da ka warware, da AI ko babu, don nuna ƙwarewarka ga makarantu, masu aiki ko kwastomomi.","# 9.13 Bayyana yadda AI ya taimaka","Idan ya dace, ka iya bayyana a fili waɗanne sassan aikinka AI ya tallafa musu da waɗanda hukuncinka ne.","# 9.14 AI da ilimin noma","Ɗaliban noma na iya amfani da AI wajen tsara bincike, shirya kayan faɗaɗa noma da bayyana batutuwan fasaha ga manoma da harshe mafi sauƙi.","# 9.15 Misalin ilimin noma na Najeriya","Ɗalibin ilimin noma na shekarar ƙarshe na iya amfani da AI wajen shirya tsarin rahoton aikinsa, sannan ya tabbatar da duk bayanai da lambobi da sakamakon gonarsa na gaske.","# 9.16 Tarin fasaha na sana'ar tufafi","Mai sayar da tufafi da ke haɗa fasahar ɗinki, hidimar kwastomomi da abun ciki na talla da AI ya taimaka na gina kasuwanci mafi ƙarfi fiye da kowace fasaha ɗaya.","# 9.17 Daidaitawa fasaha ce","Shirin koyon sababbin kayan aiki yayin da suke bayyana, ba tare da dogara ga ɗaya kaɗai ba, fasaha ce mai daraja a kanta.","# 9.18 Zagayen Koyi-Gina-Yi Amfani","Koyi wani ra'ayi, gina wani ƙarami da shi, ka yi amfani da shi a yanayi na gaske, sannan ka maimaita da ra'ayi na gaba.","# 9.19 Atisaye: gina tarin fasahar AI naka","Jera fasahohi biyu da kake da su. Rubuta hanya ɗaya da AI zai iya tallafa wa kowanne a wannan watan.","# 9.20 Tsarin fasahohin kwana 30","Zaɓi fasaha ɗaya da kake da ita don ƙarfafawa da sabuwar ɗabi'a ɗaya ta AI don ginawa a kwanaki 30 masu zuwa.","# 9.21 Ƙirƙiri tsarin fasahar AI naka","Rubuta: babbar fasahata, yadda AI ke tallafa mata, buri ɗaya na wannan wata, da hanya ɗaya da zan duba ci gabana.","# 9.22 Kada ka bi kowane sabon salon AI","Sababbin kayan aikin AI na bayyana akai-akai. Zurfi a kaɗan yawanci ya fi amfani fiye da gwaji marar zurfi a da yawa.","# 9.23 Shirya wa ci gaba da koyo","Ɗauki koyon AI a matsayin ɗabi'a mai ci gaba, ba aiki na lokaci ɗaya da za a gama a manta ba.","# 9.24 Muhimman darussa","Makomar aiki na ba wa mutanen da ke haɗa fasaha ta gaske, daidaitawa da amfani da AI cikin hikima lada, ba amfani da AI kaɗai ba."];
CH[9].full=["Reading about AI is useful, but real progress comes from consistent practice. This chapter gives you a simple 30-day plan.","# 10.1 How to use this 30-day plan","Follow the weeks in order, but adjust the daily tasks to fit your own schedule and responsibilities.","# 10.2 Week 1: Learn the basics","The first week focuses on understanding AI and building basic comfort with prompts.","# 10.3 Day 1: Understand AI","Reread Chapter 1 and write, in your own words, what AI is and is not.","# 10.4 Day 2: Explore AI tools","Open an AI tool you have access to and try three simple, harmless questions.","# 10.5 Day 3: Learn to write better prompts","Practise the Task + Context + Audience + Format formula on one real question of your own.","# 10.6 Day 4: Practise asking AI questions","Ask AI to explain something you studied recently, then ask it to explain the same thing more simply.","# 10.7 Day 5: Learn to check AI results","Take one AI answer and verify at least one fact from it using another source.","# 10.8 Day 6: Practise with your own skill","Apply AI to one task related to your own field of study or work.","# 10.9 Day 7: Review your first week","Write down what surprised you and what you want to improve next week.","# 10.10 Week 2: Use AI for work and productivity","The second week applies AI to real productivity tasks from Chapter 3.","# 10.11 Days 8-14: Practical productivity tasks","Each day, use AI for one real task: a draft, a summary, a checklist, a plan, or a piece of research organization.","# 10.12 Week 3: Create something useful","The third week focuses on content creation and small, practical projects from Chapters 6 and 7.","# 10.13 Days 15-21: Build a practical project","Choose one small project (a set of social posts, a study guide or a simple service offer) and build it step by step using AI support.","# 10.14 Week 4: Apply AI to real life","The final week connects everything to your actual studies, business or work environment.","# 10.15 Days 22-28: Use AI in your own environment","Apply what you have learned to a real assignment, a real customer or a real personal goal.","# 10.16 Day 29: Build your personal AI system","Write down the tools, prompts and habits that worked best for you over the past month.","# 10.17 Day 30: Plan your next 30 days","Choose one skill to deepen and one new area to explore in the coming month.","# 10.18 Your 30-day AI scorecard","Rate yourself honestly on prompt-writing, checking results, privacy habits and combining AI with your own skills.","# 10.19 Your personal AI rulebook","Collect the personal rules you have built throughout this plan into one short, memorable list.","# 10.20 Final 30-day challenge","Teach one thing you learned about AI to someone else in your community, in Hausa or English.","# 10.21 Key lessons","Consistent, small daily practice builds real AI capability faster than reading alone."];HA[9].full=["Karanta game da AI na da amfani, amma ci gaba na gaske na zuwa ne daga aiki na dagewa. Wannan babi na ba ka tsari mai sauƙi na kwana 30.","# 10.1 Yadda ake amfani da tsarin kwana 30","Bi makonni bisa jerin su, amma ka daidaita ayyukan yau da kullum da jadawalinka da nauyinka.","# 10.2 Mako na 1: Koyi tushe","Makon farko na mai da hankali kan fahimtar AI da samun ɗan sabawa da prompt.","# 10.3 Rana ta 1: Fahimci AI","Sake karanta Babi na 1 ka rubuta, da kalmominka, menene AI da abin da ba shi ba.","# 10.4 Rana ta 2: Bincika kayan aikin AI","Buɗe wani kayan aikin AI da kake iya samu ka gwada tambayoyi uku masu sauƙi marasa cutarwa.","# 10.5 Rana ta 3: Koyi rubuta prompt mafi kyau","Gwada tsarin Aiki + Yanayi + Masu karatu + Tsari a kan tambaya ɗaya ta gaske taka.","# 10.6 Rana ta 4: Gwada yin tambayoyi ga AI","Roƙi AI ya bayyana abin da ka karanta kwanan nan, sannan ka roƙe shi ya sake bayyana shi a saukake.","# 10.7 Rana ta 5: Koyi duba sakamakon AI","Ɗauki amsa ɗaya ta AI ka tabbatar da aƙalla gaskiya ɗaya daga cikinta ta wata madogara.","# 10.8 Rana ta 6: Gwada da fasaharka","Yi amfani da AI a aiki ɗaya da ya shafi fannin karatunka ko aikinka.","# 10.9 Rana ta 7: Bita makon farko","Rubuta abin da ya ba ka mamaki da abin da kake so ka inganta a mako mai zuwa.","# 10.10 Mako na 2: Yi amfani da AI a aiki da haɓaka aiki","Mako na biyu na amfani da AI a ayyukan haɓaka aiki na gaske daga Babi na 3.","# 10.11 Kwanaki 8-14: Ayyukan haɓaka aiki masu amfani","Kowace rana, yi amfani da AI a aiki ɗaya na gaske: daftari, taƙaitawa, jerin abubuwan yi, tsari, ko tsara bincike.","# 10.12 Mako na 3: Ƙirƙiri wani abu mai amfani","Mako na uku na mai da hankali kan ƙirƙirar abun ciki da ƙananan ayyuka masu amfani daga Babi na 6 da 7.","# 10.13 Kwanaki 15-21: Gina aiki mai amfani","Zaɓi ƙaramin aiki ɗaya (tarin rubutun social media, jagorar karatu ko tayin hidima mai sauƙi) ka gina shi mataki-mataki da taimakon AI.","# 10.14 Mako na 4: Yi amfani da AI a rayuwa ta gaske","Makon ƙarshe na haɗa komai da karatunka, kasuwancinka ko wurin aikinka na gaske.","# 10.15 Kwanaki 22-28: Yi amfani da AI a muhallinka","Yi amfani da abin da ka koya a aikin makaranta na gaske, kwastoma na gaske ko buri na kanka na gaske.","# 10.16 Rana ta 29: Gina tsarin AI naka","Rubuta kayan aiki, prompt da halayen da suka fi yi maka aiki a wata da ya wuce.","# 10.17 Rana ta 30: Shirya kwanaki 30 masu zuwa","Zaɓi fasaha ɗaya da za ka zurfafa da sabon fanni ɗaya da za ka bincika a wata mai zuwa.","# 10.18 Katin ƙimar AI na kwana 30","Ƙima kanka da gaskiya a rubuta prompt, duba sakamako, halayen sirri da haɗa AI da fasaharka.","# 10.19 Ƙa'idojin AI naka","Tattara ƙa'idojin da ka gina a wannan tsari zuwa gajeren jeri mai sauƙin tunawa.","# 10.20 Ƙalubalen ƙarshe na kwana 30","Koya wa wani a al'ummarka abu ɗaya da ka koya game da AI, da Hausa ko Turanci.","# 10.21 Muhimman darussa","Aiki na ƙanana kullum da dagewa na gina ainihin ƙwarewar AI da sauri fiye da karatu kaɗai."];
CH[10].full=["# 11.1 AI is a tool","Throughout this book, one idea repeats: AI is a tool, not a replacement for your judgment, effort, or responsibility.","# 11.2 Your knowledge still matters","Whatever you already know (agriculture, business, teaching, language) remains the foundation that makes AI genuinely useful to you.","# 11.3 Start with your existing skills","The most effective starting point is not a new AI tool, but a skill or problem you already understand well.","# 11.4 Do not chase every new tool","New tools will keep appearing. Depth and consistency with a few tools will serve you better than constantly switching.","# 11.5 Build a simple AI system","Carry forward the habits, prompts, and checklists from this book into a simple personal system you can reuse.","# 11.6 The beginning is yours","This book ends here, but your own use of AI is only beginning. Keep learning, keep practising, and keep adapting as the technology changes.","# Resources: Useful AI tools and resources","# 12.1 ChatGPT","A general-purpose AI assistant useful for writing, explaining, planning, and answering questions in simple English or Hausa.","# 12.2 Canva","A design tool useful for turning AI-generated text and ideas into flyers, social-media graphics, and simple presentations.","# 12.3 CapCut","A video-editing application useful for turning a short script into a finished video for TikTok or Facebook.","# 12.4 Google Gemini","Another general AI assistant that can be used similarly to ChatGPT for writing and research support.","# 12.5 Microsoft Copilot","An AI assistant integrated into Microsoft tools, useful for documents, spreadsheets, and presentations.","# 12.6 Nigerian digital business channels","WhatsApp Business, Facebook Pages, and Instagram remain some of the most widely used channels for small-business communication in Nigeria.","# 12.7 WhatsApp Business","Useful for organizing customer communication, catalogues, and automated greeting messages.","# 12.8 Facebook and Instagram","Useful for building a public audience, sharing educational content, and promoting products.","# 12.9 TikTok","Useful for short, engaging educational or promotional videos aimed at a younger audience.","# 12.10 Digital payment and business tools","Mobile banking apps and payment platforms help small businesses receive payments and keep basic digital records.","# 12.11 A simple digital business system","Combine one messaging channel, one social platform, and one payment tool into a simple, manageable system rather than trying to use everything at once.","# 12.12 How to choose the right AI tool","Choose based on the task you need to complete, the language you need to work in, and what is actually accessible to you.","# 12.13 Privacy and safety","Always review any tool's approach to your data before sharing sensitive personal or business information.","# 12.14 Beginner AI starter kit","For most beginners, one general AI assistant, one design tool, and one messaging platform are enough to start putting this book into practice."];HA[10].full=["# 11.1 AI kayan aiki ne","A cikin wannan littafi, ra'ayi ɗaya na maimaituwa: AI kayan aiki ne, ba mai maye gurbin hukuncinka, ƙoƙarinka ko nauyinka ba.","# 11.2 Iliminka na da muhimmanci","Duk abin da ka riga ka sani (noma, kasuwanci, koyarwa, harshe) na nan a matsayin tushen da ke sa AI ya zama mai amfani gare ka da gaske.","# 11.3 Fara da fasahohin da kake da su","Mafi ingancin wurin farawa ba sabon kayan aikin AI ba ne, sai fasaha ko matsalar da ka riga ka fahimta sosai.","# 11.4 Kada ka bi kowane sabon kayan aiki","Sababbin kayan aiki za su ci gaba da bayyana. Zurfi da dagewa a kaɗan zai fi amfani gare ka fiye da sauya su kullum.","# 11.5 Gina tsarin AI mai sauƙi","Ɗauki halaye, prompt da jerin dubawa daga wannan littafi zuwa tsari mai sauƙi na kanka da za ka iya sake amfani da shi.","# 11.6 Farawa naka ne","Littafin ya ƙare nan, amma amfaninka da AI na farawa ne kawai. Ci gaba da koyo, ci gaba da gwadawa, ci gaba da daidaitawa yayin da fasahar ke canzawa.","# Kayan aiki: Kayan aikin AI da hanyoyin taimako masu amfani","# 12.1 ChatGPT","Mataimakin AI na gama-gari mai amfani wajen rubutu, bayani, tsarawa da amsa tambayoyi da Turanci mai sauƙi ko Hausa.","# 12.2 Canva","Kayan zane mai amfani wajen mai da rubutu da ra'ayoyin da AI ya samar fosta, zanen social media da gabatarwa masu sauƙi.","# 12.3 CapCut","Manhajar gyaran bidiyo mai amfani wajen mai da gajeren script bidiyo da aka kammala don TikTok ko Facebook.","# 12.4 Google Gemini","Wani mataimakin AI na gama-gari da ake iya amfani da shi kamar ChatGPT don taimakon rubutu da bincike.","# 12.5 Microsoft Copilot","Mataimakin AI da aka haɗa cikin kayan Microsoft, mai amfani ga takardu, spreadsheets da gabatarwa.","# 12.6 Hanyoyin kasuwancin dijital na Najeriya","WhatsApp Business, shafukan Facebook da Instagram na cikin hanyoyin da aka fi amfani da su wajen sadarwar ƙananan sana'o'i a Najeriya.","# 12.7 WhatsApp Business","Mai amfani wajen tsara sadarwa da kwastomomi, kundin kaya da saƙonnin gaisuwa na atomatik.","# 12.8 Facebook da Instagram","Masu amfani wajen gina masu bibiya na jama'a, raba abun ciki na ilimi da tallata kaya.","# 12.9 TikTok","Mai amfani ga gajerun bidiyo masu jan hankali na ilimi ko talla da ake nufin matasa.","# 12.10 Kayan biyan kuɗi da na kasuwanci na dijital","Manhajojin banki na waya da dandalin biyan kuɗi na taimaka wa ƙananan sana'o'i wajen karɓar kuɗi da riƙe bayanan dijital na asali.","# 12.11 Tsarin kasuwancin dijital mai sauƙi","Haɗa hanyar saƙo ɗaya, dandalin social media ɗaya da kayan biyan kuɗi ɗaya zuwa tsari mai sauƙin sarrafawa maimakon ƙoƙarin amfani da komai a lokaci ɗaya.","# 12.12 Yadda ake zaɓar kayan aikin AI da ya dace","Zaɓi bisa aikin da kake buƙatar kammalawa, harshen da kake buƙatar aiki da shi, da abin da za ka iya samu da gaske.","# 12.13 Sirri da tsaro","Kullum ka duba yadda kowane kayan aiki ke tafiyar da bayananka kafin ka bayyana bayanan sirri na kanka ko na kasuwanci.","# 12.14 Kayan farko na mafari a AI","Ga yawancin mafari, mataimakin AI na gama-gari ɗaya, kayan zane ɗaya da dandalin saƙo ɗaya sun isa don fara aiwatar da wannan littafi."];
CH[0].full.unshift(...["# Introduction: Welcome to the AI era","Artificial Intelligence has moved from research laboratories into ordinary daily life. It is now part of how people learn, communicate, work, run businesses, and solve everyday problems.","This book was written for students, teachers, farmers, small-business owners, job seekers, and anyone who wants to use AI in simple, practical, and responsible ways.","You do not need a technical background to benefit from AI. You only need curiosity, patience, and a willingness to practise.","Each chapter builds on the one before it. Chapters 1 and 2 introduce AI and show how it can support learning. Chapters 3 and 4 apply AI to work, productivity, and small business. Chapter 5 teaches you to use ChatGPT more effectively, and Chapter 6 focuses on content creation. Chapter 7 explores realistic ways to earn income with AI skills, Chapter 8 helps you become genuinely effective rather than just active, Chapter 9 connects AI to the future of work, and Chapter 10 gives you a 30-day action plan to put everything into practice.","Read at your own pace. Try the examples. Adjust them to your own life, language, and community. AI works best when it is combined with your own knowledge, effort, and judgment.","Welcome to the AI era. Let us begin."]);HA[0].full.unshift(...["# Gabatarwa: Barka da zuwa zamanin AI","Ƙirƙirarriyar Basira (AI) ta bar dakunan bincike ta shiga rayuwar yau da kullum. Yanzu tana cikin yadda mutane ke koyo, sadarwa, aiki, gudanar da kasuwanci da warware matsalolin yau da kullum.","An rubuta wannan littafi ne ga ɗalibai, malamai, manoma, masu ƙananan sana'o'i, masu neman aiki da duk wanda yake son amfani da AI ta hanya mai sauƙi, mai amfani kuma mai nauyi.","Ba ka buƙatar ilimin fasaha kafin ka amfana da AI. Kana buƙatar sha'awa, haƙuri da shirin yin aiki kawai.","Kowane babi na ginuwa a kan wanda ya gabace shi. Babi na 1 da na 2 na gabatar da AI kuma suna nuna yadda zai taimaka wajen koyo. Babi na 3 da na 4 na amfani da AI a aiki, haɓaka aiki da ƙananan sana'o'i. Babi na 5 na koya maka amfani da ChatGPT da kyau, kuma Babi na 6 na mai da hankali kan ƙirƙirar abun ciki. Babi na 7 na bincika hanyoyin samun kuɗi na gaske da fasahar AI, Babi na 8 na taimaka maka ka zama mai ƙwarewa da gaske ba kawai mai aiki ba, Babi na 9 na haɗa AI da makomar aiki, kuma Babi na 10 na ba ka tsarin aiki na kwana 30 don aiwatar da komai.","Karanta a hankalinka. Gwada misalan. Ka daidaita su da rayuwarka, harshenka da al'ummarka. AI na aiki mafi kyau idan aka haɗa shi da iliminka, ƙoƙarinka da hukuncinka.","Barka da zuwa zamanin AI. Mu fara."]);

return `<h1>${U().title}</h1><p class="mut">${U().by}</p><div class="card"><b>${U().it}</b><p class="mut" style="margin:6px 0 0">${U().ih}</p>${dp?`<div class="row"><button data-a="inst">${U().ib}</button></div>`:""}</div><p class="mut">${U().sub}</p>
<div class="bar" role="progressbar" aria-valuenow="${n}" aria-valuemax="${CH.length}"><i style="width:${n/CH.length*100}%"></i></div>
<p class="mut">${U().prog(n,CH.length)}</p>
${CH.map((_,i)=>{const c=T(i);return `<button class="ch ${st.done[i]!=null?'done':''}" data-c="${i}"><span class="n">${st.done[i]!=null?'✓':i+1}</span><span><b>${c.t}</b><span class="mut">${st.done[i]!=null?U().best+st.done[i]+'/'+c.q.length:U().ns}</span></span></button>`}).join("")}`}
function read(){const c=T(st.open);
return `<button class="ghost" data-a="home">${U().back}</button><h2 style="margin-top:16px">${U().ch} ${st.open+1}: ${c.t}</h2>
<div class="card"><ul>${c.k.map(x=>`<li>${x}</li>`).join("")}</ul></div>
${c.full?`<details class="card"><summary><b>${U().fl}</b></summary>${c.full.map(f=>f[0]=="#"?`<h3>${f.slice(2)}</h3>`:`<p>${f}</p>`).join("")}</details>`:""}
<div class="take"><b>${U().tk}</b> ${c.take}</div>
<button data-a="quiz">${U().qz}</button>`}
function quiz(){const c=T(st.open),q=c.q[st.q];
if(!q)return `<h2>${U().qd}</h2><div class="card"><p style="font-size:20px">${U().sc(st.score,c.q.length)}</p><p class="mut">${st.score==c.q.length?U().pf:U().rt}</p></div>
<div class="row"><button data-a="read">${U().rr}</button><button class="ghost" data-a="home">${U().al}</button>${st.open<CH.length-1?`<button class="ghost" data-a="next">${U().nx}</button>`:''}</div>`;
return `<p class="mut">${U().qn(st.q+1,c.q.length)}</p><h2>${q[0]}</h2>
${q[1].map((o,i)=>`<button class="opt ${st.sel!=null?(i==q[2]?'ok':(i==st.sel?'no':'')):''}" data-o="${i}" ${st.sel!=null?'disabled':''}>${o}</button>`).join("")}
${st.sel!=null?`<p style="margin-top:14px">${st.sel==q[2]?U().ok:U().no}</p><button data-a="nextq">${U().go}</button>`:''}`}
let D={};try{D=JSON.parse(localStorage.getItem("aiDays")||"{}")||{}}catch(e){}
function plan(){const u=U(),n=Object.keys(D).length;return `<h1>${u.pl}</h1><p class="mut">${u.pp}</p><div class="bar"><i style="width:${n/30*100}%"></i></div><p class="mut">${u.dn(n)}</p>${u.wk.map((w,i)=>`<div class="card"><b>${w}</b><div class="row">${Array.from({length:i<3?7:9},(_,j)=>{const d=i*7+j+1;return `<button class="${D[d]?'':'ghost'}" data-d="${d}" aria-pressed="${!!D[d]}" style="min-width:44px;padding:8px">${d}</button>`}).join("")}</div></div>`).join("")}`}
function prompt(){const u=U();const f=i=>`<label for="p${i+1}">${u.l[i]}</label><input id="p${i+1}" placeholder="${u.ph[i]}">`;
return `<h1>${u.pt}</h1><p class="mut">${u.pd}</p><div class="card">${[0,1,2,3,4].map(f).join("")}<pre id="res" aria-live="polite">${u.pr}</pre><div class="row"><button id="cp">${u.cp}</button><button class="ghost" id="clr">${u.cl}</button></div></div><p class="mut">${u.pn}</p>`}
function build(){
const v=i=>($("#p"+i).value||"").trim();
const [a,b,c,d,e]=[1,2,3,4,5].map(v);
const parts=[a&&a+(/[.!?]$/.test(a)?"":"."),b&&b+(/[.!?]$/.test(b)?"":"."),c&&U().aud+c+".",d&&U().out+d+".",e];
const t=parts.filter(Boolean).join(" ");
$("#res").textContent=t||U().pr;return t}
function render(){
const m=$("#app");const N=document.querySelectorAll("nav button");N[0].textContent=U().nav1;N[1].textContent=U().nav2;N[2].textContent=U().nav3;N[3].textContent=U().lang;document.documentElement.lang=L;
m.innerHTML=st.tab=="prompt"?prompt():st.tab=="plan"?plan():st.open==null?home():st.mode=="read"?read():quiz();
document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.t==st.tab));
if(st.tab=="prompt"){document.querySelectorAll("input").forEach(i=>i.oninput=build);
$("#cp").onclick=async()=>{const t=build();if(!t)return;try{await navigator.clipboard.writeText(t);$("#cp").textContent=U().cd}catch(e){const r=document.createRange();r.selectNodeContents($("#res"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#cp").textContent=U().sl}};
$("#clr").onclick=()=>{document.querySelectorAll("input").forEach(i=>i.value="");build()}}}
document.addEventListener("click",e=>{
const nb=e.target.closest("nav button");if(nb){if(nb.dataset.t=="lang"){L=L=="ha"?"en":"ha";try{localStorage.setItem("aiL",L)}catch(x){}}else st.tab=nb.dataset.t;render();scrollTo(0,0);return}
const b=e.target.closest("button");if(!b)return;
if(b.dataset.c!=null){st.open=+b.dataset.c;st.mode="read"}
const a=b.dataset.a;if(a=="inst"){if(dp)dp.prompt();return}
if(a=="home"){st.open=null}
if(a=="read"){st.mode="read"}
if(a=="quiz"){st.mode="quiz";st.q=0;st.score=0;st.sel=null}
if(a=="next"){st.open++;st.mode="read"}
if(b.dataset.o!=null&&st.sel==null){st.sel=+b.dataset.o;if(st.sel==CH[st.open].q[st.q][2])st.score++}
if(a=="nextq"){st.q++;st.sel=null;if(st.q>=CH[st.open].q.length){const p=st.done[st.open];if(p==null||st.score>p){st.done[st.open]=st.score}save()}}
if(b.dataset.d!=null){const d=b.dataset.d;if(D[d])delete D[d];else D[d]=1;try{localStorage.setItem("aiDays",JSON.stringify(D))}catch(x){}}
if(b.dataset.c==null&&a==null&&b.dataset.o==null&&b.dataset.d==null)return;
render();if(b.dataset.d==null)scrollTo(0,0)});
render();
</script>
</body>
</html>
