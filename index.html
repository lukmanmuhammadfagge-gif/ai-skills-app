<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI for Everyday Life</title>
<meta name="theme-color" content="#1f6b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Everyday">
<style>
:root{--bg:#f3f6ee;--card:#fff;--ink:#1d2a1f;--mut:#5b6b5e;--acc:#1f6b3a;--acc2:#e9f2e4;--line:#d5dfcc;--bad:#a63d2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1a251d;--ink:#e6efe4;--mut:#9db0a0;--acc:#6fcf8e;--acc2:#213026;--line:#2c3d31;--bad:#f08a7a}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1a251d;--ink:#e6efe4;--mut:#9db0a0;--acc:#6fcf8e;--acc2:#213026;--line:#2c3d31;--bad:#f08a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:28px;line-height:1.15;margin:8px 0 4px}
h2{font-size:22px;margin:0 0 6px}
p{margin:0 0 12px}
.mut{color:var(--mut);font:14px/1.5 system-ui,sans-serif}
button{font:600 15px system-ui,sans-serif;cursor:pointer;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);padding:11px 16px;min-height:44px}
button.ghost{background:transparent;color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0 20px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.ch{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:10px;padding:14px;font:16px Georgia,serif}
.ch b{font:600 15px system-ui,sans-serif;display:block}
.ch span.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font:700 15px system-ui,sans-serif}
.ch.done span.n{background:var(--acc);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
ul{padding-left:20px;margin:0}li{margin-bottom:8px}
.take{background:var(--acc2);border-left:4px solid var(--acc);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px;font:15px system-ui,sans-serif;font-weight:400}
.opt.ok{border-color:var(--acc);background:var(--acc2)}
.opt.no{border-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{padding:10px 4px;font-size:13px;background:transparent;color:var(--mut);border:0;flex:1;max-width:200px}
nav button[aria-current=true]{color:var(--acc);background:var(--acc2)}
summary{cursor:pointer;min-height:32px}h3{font-size:17px;margin:16px 0 6px}
label{display:block;font:600 14px system-ui,sans-serif;margin:12px 0 4px}
input,textarea{width:100%;font:16px system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
pre{white-space:pre-wrap;font:15px/1.5 system-ui,sans-serif;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-t="learn">Chapters</button>
<button data-t="prompt">Prompt builder</button>
<button data-t="plan">30</button>
<button data-t="lang">Hausa</button>
</nav>
<script>
const CH=[
{t:"What is AI?",k:["AI lets computers do tasks that normally need human intelligence: understanding language, spotting patterns, making predictions.","You already use it: face unlock, autocorrect, maps, product suggestions, fraud alerts.","Traditional AI predicts and classifies. Generative AI creates text, images, ideas, code and video scripts.","A prompt is the instruction you give AI. More detail gives a better answer.","AI can be wrong, so check important facts. It is a tool, not a replacement for judgment."],
take:"Start with a real problem. Ask clearly. Check the result. Use your own judgment.",
q:[["What is a prompt?",["A computer virus","The question or instruction you give AI","A type of phone"],1],["Which is generative AI?",["A system that writes a summary","A calculator","A light switch"],0],["Should you believe every AI answer?",["Yes","No, check important information","Only on weekends"],1]]},
{t:"How AI helps you learn",k:["Ask AI to explain hard topics in simple language, then ask for examples.","Ask for practice questions without answers. Try them first, then check.","Tell AI what you find difficult so it can focus on your weak areas.","Use AI to plan study time, for example a seven-day plan with 30 minutes each evening.","Do not let AI do your homework. Use: Ask, Understand, Practise, Answer, Check."],
take:"Use AI to understand more, not to think less.",
q:[["Best way to use practice questions?",["Read the answers first","Answer them yourself, then check","Skip them"],1],["Is AI-generated research always correct?",["Yes","No, verify with reliable sources","Only if it gives references"],1]]},
{t:"AI for work and productivity",k:["AI can draft messages, rewrite text, make checklists, organise ideas and prepare you for interviews.","Always read the final version before you send it.","Do not share passwords, PINs, codes, bank details or private customer records.","Verify dates, names, figures, prices, policies and legal or financial information.","AI cannot guarantee an offer is genuine. Be careful when anyone asks for urgent money or codes."],
take:"Think first. Protect your information. Check the result. Make the final decision.",
q:[["Which should you never give AI?",["A topic to explain","Passwords and verification codes","A draft message"],1],["Who makes the final decision?",["AI","You","The chatbot"],1]]},
{t:"AI for small businesses",k:["Use AI for product descriptions, WhatsApp posts, Facebook captions and content calendars.","Create reusable replies for price, sizes, location, delivery and payment. Make sure the facts are correct.","Real conditions matter: supplier prices, bargaining, transport, data costs, electricity, limited capital.","Loop: AI drafts, you check, you correct, then publish.","Online visibility does not guarantee sales. Quality, trust, price and service still matter."],
take:"AI should strengthen your business, not replace your judgment.",
q:[["What is a safe business workflow?",["AI drafts, human checks","AI posts alone","Copy without reading"],0],["Does being online guarantee sales?",["Yes","No"],1]]},
{t:"Using ChatGPT effectively",k:["Start with a clear task, not a single word.","Add details: topic, purpose, audience, length, language level, format.","Improve the first result: make it simpler, shorter or more practical.","Break big tasks into parts: outline, introduction, chapters, editing.","Tell AI what to avoid, and ask it to say what you should verify."],
take:"AI can help you produce more. Good judgment helps you produce what is useful.",
q:[["Which is the prompt formula?",["Task + Context + Audience + Format + Requirements","Question + Luck","Topic only"],0],["Your first prompt must be perfect.",["True","False, you can refine it"],1]]},
{t:"AI for content creation",k:["Start with your own idea or experience. AI helps develop it.","Use AI for captions, video hooks, scripts and content structure.","One idea can become a post, an article, a video script and a checklist.","Plan a weekly content calendar instead of asking daily what to post.","Do not copy and paste. Read, edit, add your ideas and fact-check."],
take:"Your ideas, knowledge, editing and consistency create the real value.",
q:[["What should you do with AI-generated content?",["Publish it exactly","Edit it and add your own ideas","Delete your ideas"],1],["Where should good content start?",["Your own idea","Random text"],0]]},
{t:"Ways to make money with AI",k:["AI supports income work but does not create income by itself. People pay for useful results.","Formula: Skill + AI + Problem + Customer = Opportunity.","Build three samples first: a post, a product description, a one-page educational document.","Pick one customer type you understand and start with a small project.","Minimum price = direct costs + value of your time + reasonable profit."],
take:"Be wary of easy-money claims. Real work needs skills, customers, quality and reliability.",
q:[["What should you build before looking for customers?",["Three samples of your work","A big website"],0],["Does AI make you rich automatically?",["Yes","No"],1]]},
{t:"Becoming effective with AI",k:["Using AI often is not the same as using it well.","Common mistakes: accepting the first answer, vague instructions, sharing private information.","Use a prompt pattern: Task + Context + Audience + Format + Requirements. Ask AI not to invent facts.","Learn from disappointing results: ask what your instructions were missing.","Use fewer tools well, track what works, and write your own AI rulebook."],take:"Effectiveness comes from good habits, not from using AI constantly.",q:[["Is using AI often the same as using it well?",["Yes","No"],1],["What should you do when a result disappoints you?",["Blame the tool","Ask what your prompt was missing"],1]]},
{t:"AI, skills and the future of work",k:["AI is a tool. A skill is built by practice and stays yours.","AI amplifies what you already know. Human skills stay valuable: communication, problem-solving, honesty, discipline.","Build a skill stack, for example agriculture + communication + basic AI use.","Keep a portfolio of problems you solved and be able to explain how AI helped.","Do not chase every new tool. Learn, build, use, then repeat."],take:"The future of work rewards real skills, adaptability and thoughtful AI use.",q:[["What is a skill stack?",["A combination of two or more skills","A pile of apps"],0],["Should you chase every new AI tool?",["Yes","No, depth in a few tools is better"],1]]},
{t:"Your 30-day AI action plan",k:["Week 1: learn the basics, prompts and how to check results.","Week 2: use AI for real work tasks such as drafts, summaries and checklists.","Week 3: build one small project, such as social posts, a study guide or a service offer.","Week 4: apply AI to a real assignment, customer or goal. Day 29: write your personal AI system. Day 30: plan the next 30 days.","Final challenge: teach one thing about AI to someone in your community. Track your days in the 30-day tab."],take:"Small daily practice builds real AI skill faster than reading alone.",q:[["What is Week 1 about?",["Learning the basics","Selling to customers"],0],["What is the final challenge?",["Teach someone else what you learned","Buy a new tool"],0]]},
{t:"Conclusion and resources",k:["AI is a tool, not a replacement for your judgment, effort or responsibility.","Start with a skill or problem you already understand. Your knowledge is the foundation.","Useful tools: ChatGPT, Google Gemini, Microsoft Copilot, Canva for design, CapCut for video.","Small-business channels in Nigeria: WhatsApp Business, Facebook, Instagram, TikTok.","A beginner kit is one AI assistant, one design tool and one messaging platform. Check each tool's data policy before sharing sensitive information."],take:"The beginning is yours. Keep learning, practising and adapting.",q:[["What makes AI truly useful to you?",["Your existing knowledge and skills","Owning many apps"],0],["What is a beginner kit?",["One AI assistant, one design tool, one messaging platform","Every AI tool available"],0]]}
];
const HA=[
{t:"Menene AI?",k:["AI na ba kwamfuta damar yin ayyukan da yawanci sai da basirar ɗan Adam: fahimtar harshe, gano tsari, hasashe.","Kana amfani da shi tuni: buɗe waya da fuska, gyaran rubutu, taswira, shawarwarin kaya, gargaɗin zamba.","AI na yau da kullum na hasashe da rarrabewa. Generative AI na ƙirƙirar rubutu, hotuna, ra'ayoyi, code da rubutun bidiyo.","Prompt shi ne umarnin da kake ba AI. Ƙarin bayani na kawo amsa mafi kyau.","AI na iya yin kuskure, don haka ka tabbatar da muhimman bayanai. Kayan aiki ne, ba mai maye gurbin hankalinka ba."],take:"Fara da matsala ta gaskiya. Yi tambaya a fili. Duba sakamakon. Yi amfani da hankalinka.",q:[["Menene prompt?",["Ƙwayar cuta ta kwamfuta","Tambaya ko umarnin da kake ba AI","Nau'in waya"]],["Wanne ne generative AI?",["Tsarin da ke rubuta taƙaitaccen bayani","Na'urar lissafi","Maɓallin haske"]],["Ya kamata ka yarda da kowace amsar AI?",["Eh","A'a, ka tabbatar da muhimman bayanai","Ranar Asabar kawai"]]]},
{t:"Yadda AI ke taimaka maka wajen koyo",k:["Ka roƙi AI ya bayyana maka batu mai wuya da harshe mai sauƙi, sannan ka nemi misalai.","Ka nemi tambayoyin gwaji ba tare da amsa ba. Ka amsa da kanka tukuna, sannan ka duba.","Ka gaya wa AI abin da ke yi maka wuya domin ya mai da hankali kan raunin ka.","Yi amfani da AI wajen shirya lokacin karatu, misali tsarin kwana bakwai na minti 30 kowace yamma.","Kada ka bar AI ya yi maka aikin gida. Bi: Tambaya, Fahimta, Gwaji, Amsa, Dubawa."],take:"Yi amfani da AI don ka ƙara fahimta, ba don ka daina tunani ba.",q:[["Mafi kyawun amfani da tambayoyin gwaji?",["Karanta amsoshin tukuna","Ka amsa da kanka, sannan ka duba","Ka tsallake su"]],["Bincike da AI ya yi yana da gaskiya kullum?",["Eh","A'a, ka tabbatar da amintattun madogara","Idan ya ba da madogara kawai"]]]},
{t:"Amfani da AI a aiki da haɓaka aiki",k:["AI na iya rubuta saƙonni, gyara rubutu, yin jerin abubuwan yi, tsara ra'ayoyi da shirya ka don hira ta neman aiki.","Ka karanta sigar ƙarshe kafin ka aika.","Kada ka ba AI kalmar sirri, PIN, lambobin tabbatarwa, bayanan banki ko na sirrin kwastomomi.","Ka tabbatar da kwanan wata, sunaye, lambobi, farashi, manufofi da bayanan doka ko kuɗi.","AI ba zai iya tabbatar da cewa tayi gaskiya ne ba. Ka yi hankali idan wani ya nemi kuɗi cikin gaggawa ko lambobi."],take:"Ka fara tunani. Ka kare bayananka. Ka duba sakamakon. Kai ne mai yanke shawara ta ƙarshe.",q:[["Wanne bai kamata ka ba AI ba?",["Batun da za a bayyana","Kalmar sirri da lambobin tabbatarwa","Rubutun saƙo"]],["Wane ne ke yanke shawara ta ƙarshe?",["AI","Kai","Chatbot"]]]},
{t:"AI ga ƙananan sana'o'i",k:["Yi amfani da AI don bayanin kaya, saƙonnin WhatsApp, rubutun Facebook da jadawalin abun ciki.","Ƙirƙiri amsoshin da za ka riƙa amfani da su kan farashi, girma, wuri, kai kaya da biyan kuɗi. Ka tabbatar bayanan daidai ne.","Hakikanin yanayi na da muhimmanci: farashin masu kaya, ciniki, sufuri, kuɗin data, wutar lantarki, ƙarancin jari.","Tsari: AI ya tsara, kai ka duba, ka gyara, sannan ka wallafa.","Bayyana a intanet ba ya tabbatar da sayarwa. Inganci, amana, farashi da hidima na da muhimmanci."],take:"AI ya ƙarfafa sana'arka, ba ya maye gurbin hankalinka ba.",q:[["Menene amintaccen tsarin aiki?",["AI ya tsara, mutum ya duba","AI ya wallafa shi kaɗai","A kwafa ba tare da karantawa ba"]],["Bayyana a intanet yana tabbatar da sayarwa?",["Eh","A'a"]]]},
{t:"Amfani da ChatGPT yadda ya kamata",k:["Fara da bayyanannen aiki, ba kalma ɗaya ba.","Ƙara bayani: batu, manufa, masu karatu, tsayi, matakin harshe, tsari.","Inganta sakamakon farko: ka ce a mai da shi mai sauƙi, gajere ko mai misalai.","Raba manyan ayyuka gida-gida: tsari, gabatarwa, babi, gyara.","Gaya wa AI abin da zai guji, ka kuma roƙe shi ya faɗi abin da ya kamata ka tabbatar."],take:"AI zai iya taimaka maka ka samar da abubuwa da yawa. Hankali ne ke sa su zama masu amfani.",q:[["Wane ne tsarin prompt?",["Aiki + Yanayi + Masu karatu + Tsari + Buƙatu","Tambaya + Sa'a","Batu kawai"]],["Dole prompt na farko ya zama cikakke.",["Gaskiya ne","Ƙarya ne, za ka iya gyara shi"]]]},
{t:"AI wajen ƙirƙirar abun ciki",k:["Fara da ra'ayinka ko abin da ka sani. AI na taimakawa wajen bunƙasa shi.","Yi amfani da AI don rubutun post, hooks na bidiyo, scripts da tsarin abun ciki.","Ra'ayi ɗaya na iya zama post, labari, rubutun bidiyo da jerin abubuwan yi.","Shirya jadawalin abun ciki na mako maimakon tambayar me za a wallafa kullum.","Kada ka kwafa ka liƙa. Karanta, gyara, ƙara ra'ayinka, ka tabbatar da gaskiya."],take:"Ra'ayoyinka, iliminka, gyaranka da dagewa ne ke ƙirƙirar ainihin daraja.",q:[["Me za ka yi da abun ciki da AI ya rubuta?",["Ka wallafa shi haka","Ka gyara shi ka ƙara ra'ayinka","Ka share ra'ayinka"]],["Ina ya kamata abun ciki mai kyau ya fara?",["Daga ra'ayinka","Daga rubutun bazuwar"]]]},
{t:"Hanyoyin samun kuɗi da AI",k:["AI na taimakawa aikin samun kuɗi amma ba ya samar da kuɗi da kansa. Mutane na biyan sakamako mai amfani.","Tsari: Fasaha + AI + Matsala + Kwastoma = Dama.","Ƙirƙiri samfura uku da farko: post, bayanin kaya, da takarda ta ilimi mai shafi ɗaya.","Zaɓi nau'in kwastoma ɗaya da ka fahimta, ka fara da ƙaramin aiki.","Mafi ƙarancin farashi = kuɗin aiki kai tsaye + darajar lokacinka + riba mai ma'ana."],take:"Ka yi hattara da maganar samun kuɗi cikin sauƙi. Aiki na gaske na buƙatar fasaha, kwastomomi, inganci da amana.",q:[["Me ya kamata ka ƙirƙira kafin ka nemi kwastomomi?",["Samfuran aiki uku","Babban shafin yanar gizo"]],["AI na sa ka zama mai kuɗi kai tsaye?",["Eh","A'a"]]]},
{t:"Zama mai amfani da AI yadda ya kamata",k:["Amfani da AI akai-akai ba daidai yake da amfani da shi da kyau ba.","Kuskuren da ake yawan yi: karɓar amsar farko ba tare da dubawa ba, umarni marasa haske, da bayyana bayanan sirri.","Yi amfani da tsarin prompt: Aiki + Yanayi + Masu karatu + Tsari + Buƙatu. Ka roƙi AI kada ya ƙirƙiri bayanai.","Ka koyi daga sakamakon da bai yi maka daɗi ba: ka tambayi me ya rasa a umarninka.","Yi amfani da kayan aiki kaɗan da kyau, ka lura da abin da ke aiki, ka rubuta ƙa'idojin AI naka."],take:"Ingancin amfani na zuwa daga kyawawan halaye, ba daga amfani da AI kullum ba.",q:[["Amfani da AI akai-akai daidai yake da amfani da shi da kyau?",["Eh","A'a"]],["Me za ka yi idan sakamako bai yi maka daɗi ba?",["Ka zargi na'urar","Ka tambayi me ya rasa a prompt ɗinka"]]]},
{t:"AI, fasaha da makomar aiki",k:["AI kayan aiki ne. Fasaha ana gina ta da aiki kuma ta zama taka.","AI na ƙara ƙarfin abin da ka riga ka sani. Dabarun ɗan Adam na da daraja: sadarwa, warware matsala, gaskiya da horo.","Gina tarin fasaha, misali noma + sadarwa + ɗan amfani da AI.","Ka riƙe tarin matsalolin da ka warware, ka kuma iya bayyana yadda AI ya taimaka.","Kada ka bi kowane sabon kayan aiki. Koyi, gina, yi amfani, sannan ka maimaita."],take:"Makomar aiki na ba wa masu fasaha ta gaske, daidaitawa da amfani da AI cikin hikima.",q:[["Menene tarin fasaha (skill stack)?",["Haɗin fasaha biyu ko fiye","Tarin manhajoji"]],["Ya kamata ka bi kowane sabon kayan aikin AI?",["Eh","A'a, zurfi a kaɗan ya fi"]]]},
{t:"Tsarin aikin AI na kwana 30",k:["Mako na 1: koyi tushe, prompt da yadda ake duba sakamako.","Mako na 2: yi amfani da AI a ayyukan gaske kamar rubuce-rubuce, taƙaitawa da jerin abubuwan yi.","Mako na 3: gina ƙaramin aiki, kamar rubutun social media, jagorar karatu ko tayin hidima.","Mako na 4: yi amfani da AI a aikin gaske, kwastoma ko buri. Rana ta 29: rubuta tsarin AI naka. Rana ta 30: shirya kwanaki 30 masu zuwa.","Ƙalubalen ƙarshe: koya wa wani a al'ummarka abu ɗaya game da AI. Ka bibiyi kwanakinka a shafin kwana 30."],take:"Ƙaramin aiki kullum na gina ainihin fasahar AI da sauri fiye da karatu kaɗai.",q:[["Mako na 1 na kan me?",["Koyon tushe","Sayarwa ga kwastomomi"]],["Menene ƙalubalen ƙarshe?",["Koya wa wani abin da ka koya","Sayen sabon kayan aiki"]]]},
{t:"Kammalawa da kayan aiki",k:["AI kayan aiki ne, ba mai maye gurbin hankalinka, ƙoƙarinka ko nauyinka ba.","Fara da fasaha ko matsalar da ka riga ka fahimta. Iliminka shi ne tushe.","Kayan aiki masu amfani: ChatGPT, Google Gemini, Microsoft Copilot, Canva don ƙira, CapCut don bidiyo.","Hanyoyin ƙananan sana'o'i a Najeriya: WhatsApp Business, Facebook, Instagram, TikTok.","Kayan farko: mataimakin AI ɗaya, kayan ƙira ɗaya da dandalin saƙo ɗaya. Ka duba manufar bayanai ta kowane kayan aiki kafin ka bayyana bayanan sirri."],take:"Farawa naka ne. Ci gaba da koyo, gwadawa da daidaitawa.",q:[["Me ke sa AI ya zama mai amfani gare ka da gaske?",["Iliminka da fasaharka na yanzu","Mallakar manhajoji da yawa"]],["Menene kayan farko na mafari?",["Mataimakin AI ɗaya, kayan ƙira ɗaya, dandalin saƙo ɗaya","Kowane kayan aikin AI"]]]}

CH[0].full=["# 1.1 AI in everyday life","AI is technology that allows computers and software to perform tasks that normally require human intelligence. These tasks include understanding language, recognizing patterns, answering questions, generating text and images, analyzing information, and helping people solve problems. It is no longer found only in science-fiction movies.","You may already use AI without realizing it. A phone can recognize your face. A keyboard can predict the next word. A map application can suggest routes. A streaming service can recommend movies. An online store can recommend products. A banking system can detect unusual transactions. A chatbot can answer questions and explain topics.","# 1.2 Traditional AI and generative AI","Some AI systems mainly analyze information, recognize patterns, classify things or make predictions. Generative AI is different because it creates new content from instructions: text, images, ideas, summaries, computer code, study questions, marketing content and video scripts. ChatGPT is an example of a generative AI tool.","# 1.3 What is a prompt?","A prompt is the instruction or question you give an AI system. For example: “Explain soil fertility in simple English.” You can make it more specific: “Explain soil fertility in simple English for a secondary school student. Give three examples.” The second prompt tells the AI more about the task and the reader.","# 1.4 AI does not read your mind","AI can only work with the information and instructions you provide. If your prompt is unclear, the answer may not be what you expected. Instead of “Tell me about business,” write “Give me five practical ways a small clothing business can use WhatsApp to communicate with customers.”","# 1.5 AI can make mistakes","AI can provide incorrect, incomplete, outdated or misleading information, so do not automatically believe everything it says. For information about money, health, education, laws, jobs or official requirements, check reliable sources.","# 1.6 AI is a tool, not a human","AI can produce impressive answers, but it does not replace human judgment. People still need experience, honesty, creativity, communication, critical thinking, practical knowledge, decision-making and responsibility. The goal is not to stop thinking because AI exists. The goal is to think better and work more effectively with technology.","# 1.7 AI and your existing skills","AI is more useful when combined with something you already know. Agriculture + AI: explain difficult topics, create revision questions, organize research ideas, prepare educational content. Teaching + AI: prepare lesson ideas, activities, questions and explanations. Clothing business + AI: product descriptions, customer messages and social-media content. English + AI: a conversation partner, writing assistant and practice tool.","# 1.8 What AI cannot replace","AI should not replace your judgment, personal experience, responsibility, relationships, practical skills or independent thinking. Human knowledge + AI assistance = better possibilities.","# 1.9 Learn, practise, check and improve","The best way to become comfortable with AI is practice: Learn → Practise → Check → Improve → Repeat. Do not worry about becoming an expert immediately. Start with simple tasks and gradually improve."];HA[0].full=["# 1.1 AI a rayuwar yau da kullum","AI fasaha ce da ke ba kwamfuta da manhajoji damar yin ayyukan da yawanci sai da basirar ɗan Adam: fahimtar harshe, gano tsari, amsa tambayoyi, ƙirƙirar rubutu da hotuna, nazarin bayanai da taimaka wa mutane warware matsaloli. Ba a fina-finan kimiyya kaɗai ake samunta ba.","Wataƙila kana amfani da AI ba tare da ka sani ba. Waya na iya gane fuskarka. Keyboard na iya hasashen kalma ta gaba. Manhajar taswira na iya nuna hanyoyi. Manhajar fina-finai na iya ba da shawarar fim. Kantin intanet na iya ba da shawarar kaya. Banki na iya gano hada-hadar da ba ta saba ba. Chatbot na iya amsa tambayoyi da bayyana batutuwa.","# 1.2 AI na yau da kullum da Generative AI","Wasu tsarin AI na nazarin bayanai ne, gano tsari, rarrabewa ko hasashe. Generative AI daban ne domin yana ƙirƙirar sabon abun ciki daga umarni: rubutu, hotuna, ra'ayoyi, taƙaitawa, code, tambayoyin karatu, abun tallace-tallace da rubutun bidiyo. ChatGPT misali ne na kayan aikin generative AI.","# 1.3 Menene prompt?","Prompt shi ne umarni ko tambayar da kake ba tsarin AI. Misali: “Bayyana ingancin ƙasa da Turanci mai sauƙi.” Za ka iya ƙara bayani: “Bayyana ingancin ƙasa da Turanci mai sauƙi ga ɗalibin sakandare. Ba da misalai uku.” Prompt na biyu na gaya wa AI ƙarin abu game da aikin da mai karatu.","# 1.4 AI ba ya karanta zuciyarka","AI yana aiki ne da bayanai da umarnin da ka ba shi kawai. Idan prompt ɗinka ba shi da haske, amsar na iya bambanta da abin da ka yi tsammani. Maimakon “Faɗa mini game da kasuwanci,” rubuta “Ba ni hanyoyi biyar masu amfani da ƙaramin kasuwancin tufafi zai yi amfani da WhatsApp wajen tuntuɓar kwastomomi.”","# 1.5 AI na iya yin kuskure","AI na iya ba da bayanan da ba daidai ba, ba cikakku ba, tsofaffi ko masu ruɗarwa, don haka kada ka yarda da duk abin da ya faɗa kai tsaye. Idan bayani ya shafi kuɗi, lafiya, ilimi, doka, aiki ko buƙatun hukuma, ka duba amintattun madogara.","# 1.6 AI kayan aiki ne, ba ɗan Adam ba","AI na iya ba da amsoshi masu ban sha'awa, amma ba ya maye gurbin hukuncin ɗan Adam. Mutane na buƙatar ƙwarewa, gaskiya, ƙirƙira, sadarwa, tunani mai zurfi, ilimin aiki, yanke shawara da ɗaukar nauyi. Manufar ba ta hana tunani ba ne saboda AI yana nan. Manufar ita ce ka yi tunani da aiki da kyau da taimakon fasaha.","# 1.7 AI da fasahohin da kake da su","AI na ƙara amfani idan aka haɗa shi da abin da ka riga ka sani. Noma + AI: bayyana batutuwa masu wuya, ƙirƙirar tambayoyin bita, tsara ra'ayoyin bincike, shirya abun ciki na ilimi. Koyarwa + AI: shirya ra'ayoyin darasi, ayyuka, tambayoyi da bayani. Sana'ar tufafi + AI: bayanin kaya, saƙonnin kwastomomi da abun ciki na social media. Turanci + AI: abokin hira, mai taimakon rubutu da kayan gwaji.","# 1.8 Abin da AI ba zai maye gurbinsa ba","Bai kamata AI ya maye gurbin hukuncinka, ƙwarewarka, nauyinka, dangantakarka, fasahohinka na aiki ko tunaninka na kai ba. Iliminka na ɗan Adam + taimakon AI = dama mafi kyau.","# 1.9 Koyi, gwada, duba, inganta","Hanya mafi kyau ta saba da AI ita ce gwaji: Koyi → Gwada → Duba → Inganta → Maimaita. Kada ka damu da zama gwani nan take. Fara da ayyuka masu sauƙi, sannan ka ƙara ƙwarewa a hankali."];
CH[1].full=["# 2.1 Use AI to understand difficult topics","Sometimes a textbook or lecture uses difficult language. You can ask AI to explain the topic more simply. For example: “Explain photosynthesis in simple English.” Then ask: “Give me a real-life example.” Or: “Explain it as if I am a beginner.” This allows you to learn step by step.","# 2.2 Use AI for English practice","An English learner can practise conversation with AI. You can ask AI to ask you questions, correct your grammar, explain your mistakes, help you learn vocabulary, practise conversations and improve your writing. For example: “Ask me five simple questions about my daily routine. Correct my grammar after each answer.” This creates an interactive learning exercise.","# 2.3 Use AI to summarize information","Long notes can be difficult to review. You can ask: “Summarize these notes into ten important points for revision.” However, summaries should not completely replace reading the original material.","# 2.4 Use AI to create practice questions","Practice is one of the best ways to test understanding. Ask: “Create ten multiple-choice questions about soil fertility.” After answering, ask AI to explain your mistakes. This helps you see which areas need more attention.","# 2.5 Identify your weak areas","Instead of only asking for answers, ask AI to help you find what you do not understand. For example: “Based on my answers, identify the three topics I need to study again.” This changes AI from an answer machine into a learning assistant.","# 2.6 Create a study plan","Students often know what to study but not how to organize their time. Ask: “Create a seven-day study plan for agricultural science. I can study for 30 minutes each evening.” Then adjust the plan to your actual schedule.","# 2.7 Use AI for research carefully","AI can help you generate research ideas and understand concepts. But do not assume every reference, statistic, quotation or claim from AI is correct. For academic work: identify the information, find reliable sources, check the source, compare information and use appropriate citations.","# 2.8 Use AI to simplify academic language","Ask: “Explain this paragraph in simple English without changing its meaning.” This helps you understand difficult material before returning to the original academic text.","# 2.9 Prepare for exams","AI can help with revision questions, topic summaries, definitions, explanations, practice tests and study schedules. But AI should support your learning, not do all your work. If AI gives you an answer, take time to understand why it is correct.","# 2.10 Learn by explaining","After studying, ask: “Ask me questions about this topic so I can explain what I have learned.” If you cannot explain something clearly, it may need more study.","# 2.11 Combine AI with your knowledge","The strongest learning happens when AI assistance is combined with your own thinking. An agricultural student may know practical farming activities that AI cannot fully understand from a short prompt. Your knowledge gives the answer context.","# Simple learning workflow","Choose Topic → Learn → Ask → Practise → Test → Check → Review → Repeat"];HA[1].full=["# 2.1 Yi amfani da AI don fahimtar batutuwa masu wuya","Wani lokaci littafi ko lakca na amfani da harshe mai wuya. Za ka iya roƙon AI ya bayyana batun cikin sauƙi. Misali: “Bayyana photosynthesis da Turanci mai sauƙi.” Sannan ka tambaya: “Ba ni misali na rayuwa ta gaske.” Ko: “Bayyana shi kamar ni mafari ne.” Wannan na ba ka damar koyo mataki-mataki.","# 2.2 Yi amfani da AI don gwajin Turanci","Mai koyon Turanci na iya yin hira da AI. Za ka iya roƙon AI ya yi maka tambayoyi, ya gyara nahawunka, ya bayyana kurakuranka, ya taimaka maka da kalmomi, ya yi hira da kai kuma ya inganta rubutunka. Misali: “Yi mini tambayoyi biyar masu sauƙi game da ayyukana na yau da kullum. Ka gyara nahawuna bayan kowace amsa.” Wannan na ƙirƙirar motsa jiki mai mu'amala.","# 2.3 Yi amfani da AI don taƙaita bayani","Dogayen bayanan karatu na da wahalar bita. Za ka iya cewa: “Taƙaita waɗannan bayanan zuwa muhimman abubuwa goma don bita.” Amma taƙaitawa bai kamata ta maye gurbin karanta ainihin rubutun gaba ɗaya ba.","# 2.4 Yi amfani da AI don ƙirƙirar tambayoyin gwaji","Gwaji na ɗaya daga mafi kyawun hanyoyin auna fahimta. Ka ce: “Ƙirƙiri tambayoyin zaɓi goma game da ingancin ƙasa.” Bayan ka amsa, ka roƙi AI ya bayyana kurakuranka. Wannan na taimaka maka ka ga waɗanne fannoni ne ke buƙatar ƙarin kulawa.","# 2.5 Gano raunin ka","Maimakon neman amsoshi kawai, ka roƙi AI ya taimaka maka gano abin da ba ka fahimta ba. Misali: “Bisa amsoshina, gano batutuwa uku da nake buƙatar sake karantawa.” Wannan na mai da AI daga na'urar amsa zuwa mataimakin koyo.","# 2.6 Ƙirƙiri tsarin karatu","Ɗalibai na sanin abin da za su karanta amma ba su san yadda za su tsara lokaci ba. Ka ce: “Ƙirƙiri tsarin karatu na kwana bakwai don kimiyyar noma. Zan iya karatu minti 30 kowace yamma.” Sannan ka daidaita tsarin da ainihin jadawalinka.","# 2.7 Yi bincike da AI cikin hankali","AI na iya taimaka maka wajen samar da ra'ayoyin bincike da fahimtar ra'ayoyi. Amma kada ka ɗauka cewa kowace madogara, ƙididdiga, jawabi ko da'awa daga AI daidai ce. A aikin ilimi: gano bayanin, nemo amintattun madogara, duba madogarar, kwatanta bayanai kuma yi amfani da ambato mai kyau.","# 2.8 Yi amfani da AI don sauƙaƙa harshen ilimi","Ka ce: “Bayyana wannan sakin layi da Turanci mai sauƙi ba tare da canza ma'anarsa ba.” Wannan na taimaka maka ka fahimci abu mai wuya kafin ka koma ainihin rubutun ilimin.","# 2.9 Shirya wa jarrabawa","AI na iya taimakawa da tambayoyin bita, taƙaitaccen batu, ma'anoni, bayani, gwaje-gwaje da jadawalin karatu. Amma AI ya kamata ya tallafa wa koyonka, ba ya yi maka duk aikin ba. Idan AI ya ba ka amsa, ka ɗauki lokaci ka fahimci dalilin da ya sa daidai ne.","# 2.10 Koyi ta hanyar bayani","Bayan ka karanta, ka ce: “Yi mini tambayoyi game da wannan batu don in bayyana abin da na koya.” Idan ba za ka iya bayyana wani abu a fili ba, wataƙila yana buƙatar ƙarin karatu.","# 2.11 Haɗa AI da iliminka","Koyo mafi ƙarfi na faruwa idan taimakon AI ya haɗu da tunaninka. Ɗalibin noma na iya sanin ayyukan noma na gaske da AI ba zai fahimta sosai daga ɗan gajeren prompt ba. Iliminka na ba amsar mahallin ta.","# Tsarin koyo mai sauƙi","Zaɓi batu → Koyi → Tambaya → Gwada → Jarraba → Duba → Bita → Maimaita"];
CH[2].full=["# 3.1 Drafting","AI can help you create first drafts of emails, reports, notices, business messages, applications, presentations and social-media posts. You should review and edit the result before using it.","# 3.2 Rewriting","If a message sounds unclear, AI can help improve it. For example: “Rewrite this message to make it polite, clear, and professional.” You can also specify the audience.","# 3.3 Summarizing","AI can turn long information into shorter notes. This is useful when preparing for meetings, classes, presentations, interviews and business discussions.","# 3.4 Creating checklists","A checklist helps you remember important tasks. For example: “Create a checklist for preparing a small business promotion.” Then adjust it to your situation.","# 3.5 Planning","AI can help organize tasks into a practical plan. For example: “Organize these five tasks into a simple plan for today.” The final schedule should reflect your real priorities.","# 3.6 Brainstorming","When you have an idea but do not know how to develop it, AI can suggest directions. For example: “Give me ten ideas for educational agriculture content for beginners.” Choose the ideas that fit your knowledge and audience.","# 3.7 Preparing for interviews and conversations","AI can simulate interview questions. For example: “Ask me five questions for an entry-level agricultural job interview.” Answer each question, then ask AI for feedback.","# 3.8 Organizing information","AI can organize unstructured information into tables, lists, categories, action points and summaries. This saves time when dealing with large amounts of information.","# 3.9 Protect your private information","Do not put sensitive information into an AI system unnecessarily. Avoid sharing passwords, PINs, bank details, authentication codes, recovery codes, private identity information, confidential customer information and private documents. Use the minimum information needed to complete the task.","# 3.10 Check AI-generated information","Before using an AI result, ask: Does it make sense? Is it accurate? Is it relevant? Do I need to verify it? Is there a more reliable source? The more important the information, the more carefully you should check it.","# 3.11 A practical workflow","Goal → Information → Prompt → First Result → Review → Improve → Human Judgment → Use → Learn","# Example: agricultural extension","An extension worker needs to prepare a short educational message for farmers. AI can help create a first draft. The extension worker then checks local conditions, technical accuracy, language, timing and practical recommendations. The final message should be reviewed by the human before distribution."];HA[2].full=["# 3.1 Rubuta daftari na farko","AI na iya taimaka maka ƙirƙirar daftarin farko na imel, rahotanni, sanarwa, saƙonnin kasuwanci, takardun neman aiki, gabatarwa da rubutun social media. Ya kamata ka duba ka gyara sakamakon kafin ka yi amfani da shi.","# 3.2 Sake rubutu","Idan saƙo bai bayyana sosai ba, AI na iya taimaka maka ka inganta shi. Misali: “Sake rubuta wannan saƙo ya zama mai ladabi, bayyananne da ƙwarewa.” Za ka iya kuma faɗa masa wanda zai karanta.","# 3.3 Taƙaita bayani","AI na iya mai da dogon bayani gajerun bayanai. Wannan na da amfani wajen shirya taro, azuzuwa, gabatarwa, hira ta neman aiki da tattaunawar kasuwanci.","# 3.4 Ƙirƙirar jerin abubuwan yi","Jerin abubuwan yi na taimaka maka tuna muhimman ayyuka. Misali: “Ƙirƙiri jerin abubuwan yi don shirya tallar ƙaramin kasuwanci.” Sannan ka daidaita shi da yanayinka.","# 3.5 Tsarawa","AI na iya taimaka maka tsara ayyuka zuwa tsari mai amfani. Misali: “Tsara waɗannan ayyuka biyar zuwa tsari mai sauƙi na yau.” Jadawalin ƙarshe ya kamata ya nuna ainihin abubuwan da ka fi ba fifiko.","# 3.6 Tattauna ra'ayoyi","Idan kana da ra'ayi amma ba ka san yadda za ka bunƙasa shi ba, AI na iya ba da shawarar hanyoyi. Misali: “Ba ni ra'ayoyi goma na abun ciki na ilimin noma ga mafari.” Zaɓi ra'ayoyin da suka dace da iliminka da masu karatunka.","# 3.7 Shirya wa hira da tattaunawa","AI na iya yin kwaikwayon tambayoyin hira. Misali: “Yi mini tambayoyi biyar na hirar neman aikin noma na matakin farko.” Ka amsa kowace tambaya, sannan ka roƙi AI ya ba ka ra'ayi.","# 3.8 Tsara bayanai","AI na iya tsara bayanan da ba su da tsari zuwa teburori, jeri, rukunoni, abubuwan aiwatarwa da taƙaitawa. Wannan na adana lokaci idan bayanai sun yi yawa.","# 3.9 Kare bayananka na sirri","Kada ka saka bayanan sirri cikin tsarin AI ba tare da buƙata ba. Ka guji bayyana kalmomin sirri, PIN, bayanan banki, lambobin tabbatarwa, lambobin dawo da asusu, bayanan ainihi na sirri, bayanan sirrin kwastomomi da takardu na sirri. Yi amfani da mafi ƙarancin bayanan da ake buƙata don kammala aikin.","# 3.10 Duba bayanan da AI ya samar","Kafin ka yi amfani da sakamakon AI, ka tambayi kanka: Yana da ma'ana? Daidai ne? Ya dace? Ina buƙatar tabbatarwa? Akwai madogara mafi aminci? Da muhimmancin bayanin, da ƙarin kulawar da ya kamata ka yi wajen duba shi.","# 3.11 Tsarin aiki mai amfani","Buri → Bayani → Prompt → Sakamako na farko → Dubawa → Inganta → Hukuncin ɗan Adam → Amfani → Koyo","# Misali: faɗaɗa noma (extension)","Ma'aikacin faɗaɗa noma na buƙatar shirya gajeren saƙon ilimi ga manoma. AI na iya taimakawa wajen ƙirƙirar daftarin farko. Sai ma'aikacin ya duba yanayin gida, daidaiton fasaha, harshe, lokaci da shawarwari masu amfani. Ya kamata ɗan Adam ya duba saƙon ƙarshe kafin a rarraba shi."];
CH[3].full=["# 4.1 Marketing","AI can help generate ideas for product posts, advertisements, promotional messages, social-media captions, customer messages and content calendars. For example: “Write a short WhatsApp advertisement for a new collection of men's T-shirts. Keep it friendly and simple.” Add your real product details before publishing.","# 4.2 Customer communication","You can create reusable responses for price questions, delivery questions, product availability, opening hours, payment instructions and customer follow-up. For example: “Create three polite responses to a customer asking whether a product is still available.”","# 4.3 Product descriptions","AI can turn basic product information into a clearer description. Give it accurate information: product type, size, material, colour, price and available quantity. Never allow AI to invent product features.","# 4.4 Social-media planning","AI can help organize a simple weekly plan. Monday: product post. Tuesday: helpful tip. Wednesday: customer question. Thursday: product feature. Friday: promotion. Saturday: behind-the-scenes content. Sunday: weekly review. The exact schedule should depend on your customers and business.","# 4.5 Business planning","AI can help you think through customer groups, promotion ideas, business processes, possible problems, questions to ask suppliers and ways to organize records. AI does not know your exact business situation unless you provide relevant information.","# 4.6 WhatsApp as a simple business channel","For many small businesses, messaging platforms are useful for showing products, answering customers, sharing promotions, following up and maintaining customer relationships. AI can help prepare the words, while you manage the actual customer relationship.","# 4.7 Bargaining and pricing","AI can help you prepare polite responses. For example: “Give me three polite responses to a customer who wants a lower price.” But the price decision belongs to the business owner. Consider buying cost, transport, packaging, other expenses, customer demand, competition and desired profit.","# 4.8 Changing supplier prices","Supplier prices can change. AI does not automatically know the latest price of every product in your market. Always check current supplier prices before making important pricing decisions.","# 4.9 Limited capital","A small business owner can use AI to create checklists that reduce unnecessary spending. For example: “Create a simple checklist for deciding whether I should buy more stock.” The checklist may include current stock, recent sales, customer demand, buying price, available cash and expected expenses. AI can help organize the decision, but it cannot guarantee profit.","# 4.10 Keep simple records","A business should keep basic records of sales, expenses, stock, supplier purchases, customer orders and outstanding payments. AI can help organize information, but accurate records must come from the business owner.","# 4.11 Build trust online","Online customers need confidence. Avoid false claims, fake reviews, misleading pictures, invented discounts and false product information. Honest communication protects your reputation.","# 4.12 Offline and digital business","Digital tools do not replace physical business activity. A clothing seller may still need to visit suppliers, inspect products, meet customers, manage stock, handle delivery and negotiate prices. AI should strengthen the existing business system.","# 4.13 A simple seven-day business challenge","Day 1: improve one customer message. Day 2: create one product description. Day 3: create three social posts. Day 4: make a customer-response template. Day 5: create a simple stock checklist. Day 6: review your records. Day 7: identify one process to improve."];HA[3].full=["# 4.1 Tallace-tallace","AI na iya taimakawa wajen samar da ra'ayoyi don rubutun kaya, tallace-tallace, saƙonnin talla, rubutun social media, saƙonnin kwastomomi da jadawalin abun ciki. Misali: “Rubuta gajeriyar tallar WhatsApp don sabon tarin T-shirt na maza. Ka sa ta zama ta abokantaka kuma mai sauƙi.” Ka ƙara ainihin bayanan kayanka kafin ka wallafa.","# 4.2 Sadarwa da kwastomomi","Za ka iya ƙirƙirar amsoshi da za ka riƙa amfani da su kan tambayoyin farashi, kai kaya, samuwar kaya, lokutan buɗe shago, umarnin biyan kuɗi da bibiyar kwastomomi. Misali: “Ƙirƙiri amsoshi uku masu ladabi ga kwastoma da ke tambaya ko kaya na nan.”","# 4.3 Bayanin kaya","AI na iya mai da bayanan kaya na yau da kullum bayani mafi bayyana. Ba shi ingantattun bayanai: nau'in kaya, girma, kayan da aka yi shi da su, launi, farashi da adadin da ake da shi. Kada ka bar AI ya ƙirƙiri siffofin kaya.","# 4.4 Tsara social media","AI na iya taimaka maka tsara jadawalin mako mai sauƙi. Litinin: rubutun kaya. Talata: shawara mai amfani. Laraba: tambayar kwastoma. Alhamis: siffar kaya. Jumma'a: talla. Asabar: abun ciki na bayan fage. Lahadi: bitar mako. Ainihin jadawalin ya kamata ya dogara da kwastomominka da kasuwancinka.","# 4.5 Tsara kasuwanci","AI na iya taimaka maka tunani kan rukunin kwastomomi, ra'ayoyin talla, tsarin aiki, matsalolin da za su iya tasowa, tambayoyi ga masu kaya da hanyoyin tsara bayanai. AI bai san ainihin yanayin kasuwancinka ba sai ka ba shi bayanan da suka dace.","# 4.6 WhatsApp a matsayin hanyar kasuwanci mai sauƙi","Ga ƙananan sana'o'i da yawa, dandalin saƙo na da amfani wajen nuna kaya, amsa kwastomomi, raba talla, bibiya da kula da dangantaka da kwastomomi. AI na iya taimakawa wajen shirya kalmomi, kai kuma ka ke kula da ainihin dangantakar kwastoma.","# 4.7 Ciniki da farashi","AI na iya taimaka maka shirya amsoshi masu ladabi. Misali: “Ba ni amsoshi uku masu ladabi ga kwastoma da ke son ragi.” Amma yanke shawarar farashi na mai sana'a ne. Yi la'akari da kuɗin sayan kaya, sufuri, marufi, sauran kashe-kashe, buƙatar kwastomomi, gasa da ribar da kake so.","# 4.8 Sauyin farashin masu kaya","Farashin masu kaya na iya canzawa. AI bai san sabon farashin kowane kaya a kasuwarka ta atomatik ba. Kullum ka duba farashin masu kaya na yanzu kafin ka yanke muhimmiyar shawarar farashi.","# 4.9 Ƙarancin jari","Mai ƙaramar sana'a na iya amfani da AI wajen ƙirƙirar jerin abubuwan yi da ke rage kashe kuɗi marasa amfani. Misali: “Ƙirƙiri jerin abubuwan yi mai sauƙi don yanke shawara ko in ƙara sayen kaya.” Jerin na iya haɗawa da kayan da ake da su, tallace-tallacen kwanan nan, buƙatar kwastomomi, farashin sayarwa, kuɗin hannu da kashe-kashen da ake tsammani. AI na iya taimakawa wajen tsara shawarar, amma ba zai tabbatar da riba ba.","# 4.10 Riƙe bayanan aiki masu sauƙi","Kasuwanci ya kamata ya riƙe bayanan tallace-tallace, kashe-kashe, kaya, sayayya daga masu kaya, oda na kwastomomi da basussukan da ba a biya ba. AI na iya taimakawa wajen tsara bayanai, amma ingantattun bayanai dole ne su fito daga mai kasuwancin.","# 4.11 Gina amana a intanet","Kwastomomin intanet na buƙatar tabbaci. Ka guji da'awar ƙarya, ra'ayoyin ƙarya, hotuna masu ruɗarwa, rangwamen ƙirƙira da bayanan kaya na ƙarya. Sadarwa ta gaskiya na kare suna.","# 4.12 Kasuwancin zahiri da na dijital","Kayan dijital ba sa maye gurbin aikin kasuwanci na zahiri. Mai sayar da tufafi na iya buƙatar ziyartar masu kaya, duba kaya, haɗuwa da kwastomomi, kula da kaya, kai kaya da yin ciniki. AI ya kamata ya ƙarfafa tsarin kasuwancin da ake da shi.","# 4.13 Ƙalubalen kasuwanci na kwana bakwai","Rana ta 1: inganta saƙon kwastoma ɗaya. Rana ta 2: ƙirƙiri bayanin kaya ɗaya. Rana ta 3: ƙirƙiri rubutun social media uku. Rana ta 4: yi samfurin amsar kwastoma. Rana ta 5: ƙirƙiri jerin dubawa mai sauƙi na kaya. Rana ta 6: duba bayananka. Rana ta 7: gano tsari ɗaya da za a inganta."];
CH[4].full=["# 5.1 Start with the task","First tell ChatGPT what you want. Instead of “Agriculture,” try “Explain the importance of agriculture in Nigeria in simple English.”","# 5.2 Add details","More useful context can produce a more useful response. You can specify audience, purpose, length, tone, format and level of difficulty. For example: “Explain soil fertility in simple English for a first-year agricultural student in 300 words.”","# 5.3 Tell AI who the reader is","The same topic can require different explanations. A message for a child is different from a university lecture. For example: “Explain crop production for a secondary school student.” This gives the AI useful context.","# 5.4 Choose the output","Tell AI what form you need: a paragraph, bullet points, a table, a checklist, questions and answers, a lesson outline or a short social-media post.","# 5.5 Improve the first result","Your first prompt does not have to be perfect. You can continue the conversation: “Make it shorter.” Then: “Make the English simpler.” Then: “Give me two practical examples.” This is called refining the result.","# 5.6 Break large tasks into smaller tasks","Instead of asking AI to complete a huge project in one step, divide it: create an outline, develop each section, review the content, improve the language, check important information, format the final document. Breaking work into steps makes it easier to control.","# 5.7 Tell AI what to avoid","You can give negative instructions: “Do not use difficult vocabulary.” “Do not invent statistics.” “Do not make unsupported claims.” This makes the output closer to your needs.","# 5.8 Use AI to support your own thinking","Do not simply accept the first answer. Ask: “What are the weaknesses of this idea?” Or: “Give me three possible approaches and explain the difference.” This encourages deeper thinking.","# 5.9 Ask AI to show uncertainty","For important subjects, ask: “If you are not certain about any information, clearly say so.” This does not guarantee perfect accuracy, but it encourages careful communication.","# 5.10 Check important information","Always verify important claims, particularly information about money, health, laws, government requirements, jobs, education and official deadlines.","# 5.11 Protect your privacy","Do not provide unnecessary confidential information. Use general descriptions when possible. For example, instead of sharing a customer's complete personal details, describe the situation without identifying the person.","# 5.12 Learn from better prompts","When a prompt produces a good result, save the structure. You can later adapt it for similar tasks.","# Simple prompt formula","Task + Context + Audience + Format + Requirements. For example: “Create a short product description for a men's T-shirt. The audience is Nigerian WhatsApp customers. Use simple English. Mention the colour and sizes. Keep it under 80 words.”","# Practical workflow","Task → Details → First Result → Review → Refine → Verify → Use"];HA[4].full=["# 5.1 Fara da aikin","Da farko ka gaya wa ChatGPT abin da kake so. Maimakon “Noma,” gwada “Bayyana muhimmancin noma a Najeriya da Turanci mai sauƙi.”","# 5.2 Ƙara bayani","Ƙarin mahallin da ya dace na iya ba da amsa mafi amfani. Za ka iya bayyana masu karatu, manufa, tsayi, salo, tsari da matakin wahala. Misali: “Bayyana ingancin ƙasa da Turanci mai sauƙi ga ɗalibin noma na shekarar farko cikin kalmomi 300.”","# 5.3 Gaya wa AI wane ne mai karatu","Batu ɗaya na iya buƙatar bayani daban-daban. Saƙo ga yaro ya bambanta da lakcar jami'a. Misali: “Bayyana noman amfanin gona ga ɗalibin sakandare.” Wannan na ba AI mahallin da ya dace.","# 5.4 Zaɓi sakamakon da kake so","Gaya wa AI nau'in da kake buƙata: sakin layi, jerin abubuwa, tebur, jerin abubuwan yi, tambayoyi da amsoshi, tsarin darasi ko gajeren rubutun social media.","# 5.5 Inganta sakamakon farko","Prompt ɗinka na farko ba dole ya zama cikakke ba. Za ka iya ci gaba da tattaunawa: “Ka mai da shi gajere.” Sannan: “Ka sauƙaƙa Turancin.” Sannan: “Ba ni misalai biyu masu amfani.” Ana kiran wannan gyaran sakamako.","# 5.6 Raba manyan ayyuka zuwa ƙananan ayyuka","Maimakon roƙon AI ya kammala babban aiki a mataki ɗaya, ka raba shi: ƙirƙiri tsari, bunƙasa kowane sashe, duba abun ciki, inganta harshe, duba muhimman bayanai, tsara takardar ƙarshe. Raba aiki zuwa matakai na sauƙaƙa sarrafa shi.","# 5.7 Gaya wa AI abin da zai guji","Za ka iya ba da umarni na hani: “Kada ka yi amfani da kalmomi masu wuya.” “Kada ka ƙirƙiri ƙididdiga.” “Kada ka yi da'awar da ba ta da tushe.” Wannan na kusantar da sakamako ga buƙatunka.","# 5.8 Yi amfani da AI don tallafa wa tunaninka","Kada ka karɓi amsar farko kawai. Ka tambaya: “Menene raunin wannan ra'ayi?” Ko: “Ba ni hanyoyi uku masu yiwuwa ka bayyana bambancinsu.” Wannan na ƙarfafa tunani mai zurfi.","# 5.9 Roƙi AI ya nuna rashin tabbaci","A batutuwa masu muhimmanci, ka ce: “Idan ba ka da tabbas game da wani bayani, ka faɗa a fili.” Wannan ba ya tabbatar da cikakken daidaito, amma yana ƙarfafa sadarwa mai hankali.","# 5.10 Duba muhimman bayanai","Kullum ka tabbatar da muhimman da'awa, musamman bayanai game da kuɗi, lafiya, doka, buƙatun gwamnati, aiki, ilimi da wa'adin hukuma.","# 5.11 Kare sirrinka","Kada ka bayar da bayanan sirri marasa amfani. Yi amfani da bayanin gama-gari idan zai yiwu. Misali, maimakon bayyana cikakken bayanin kwastoma, bayyana yanayin ba tare da gane mutumin ba.","# 5.12 Koyi daga prompt masu kyau","Idan prompt ya ba da sakamako mai kyau, ka adana tsarinsa. Daga baya za ka iya daidaita shi ga ayyuka makamantansu.","# Tsarin prompt mai sauƙi","Aiki + Yanayi + Masu karatu + Tsari + Buƙatu. Misali: “Ƙirƙiri gajeren bayanin kaya na T-shirt na maza. Masu karatu kwastomomin WhatsApp na Najeriya ne. Yi amfani da Turanci mai sauƙi. Ambaci launi da girma. Kada ya wuce kalmomi 80.”","# Tsarin aiki mai amfani","Aiki → Bayani → Sakamako na farko → Dubawa → Gyara → Tabbatarwa → Amfani"];
CH[5].full=["Content creation means producing useful or interesting material for an audience: Facebook posts, WhatsApp posts, TikTok scripts, educational articles, product captions, short videos, images and presentations. AI can help speed up many parts of the process.","# 6.1 Start with your own idea","Do not begin by asking “Give me something to post.” Start with an idea and use AI to develop and refine it. For example, if you already know that farmers in your area struggle with fertilizer timing, begin from that real observation, then ask AI to help you shape it into a post.","# 6.2 Creating social-media captions","A caption should be short, clear, and give the reader a reason to keep reading. Ask: “Write three short Facebook captions about the benefits of composting for smallholder farmers.” Choose the version that sounds most like your own voice, and adjust the wording before posting.","# 6.3 Facebook content","Facebook works well for longer educational posts, community discussion, and building a page around a clear topic. Ask AI to draft an explainer post, then add your own examples, photos and local details so it does not read like a generic article.","# 6.4 WhatsApp content","WhatsApp content is usually shorter and more personal, often shared in groups or broadcast lists. Ask AI for a short daily tip, a simple explanation with one example, or a friendly reminder message. Keep messages brief, since people often read them quickly on a small screen.","# 6.5 TikTok and short videos","Short videos need a strong first three seconds, one clear idea and a simple call to action. Ask: “Write a 30-second TikTok script explaining one common mistake new poultry farmers make.” Practise saying the script aloud before recording, so it sounds natural rather than read.","# 6.6 Turn one idea into several pieces of content","A single idea can become many posts across platforms. For example, one lesson about record-keeping in poultry farming can become a Facebook post, a WhatsApp tip, a TikTok script and a presentation slide. Ask AI: “Take this one idea and adapt it into a Facebook post, a WhatsApp message, and a short video script.”","# 6.7 Create a weekly content calendar","Planning ahead reduces stress and keeps your page active. Ask: “Create a simple seven-day content calendar for a page about digital skills for beginners.” Adjust it to the time you actually have each day.","# 6.8 Developing visual ideas","AI can help you describe what an image or graphic should show, even if you design it yourself in another app. For example: “Describe a simple graphic that compares organic and inorganic fertilizer in one image.” Use the description as a guide when you design the graphic in a tool like Canva.","# 6.9 Planning videos","Before recording, plan the structure. Ask AI to outline the opening hook, the main point, one practical example and a short closing message. A clear outline saves recording time and keeps the video focused.","# 6.10 Creating educational content","Educational content builds trust because it helps the audience solve a real problem. Ask: “Explain one practical benefit of AI for Hausa-speaking small-business owners, in simple language.” Add your own examples from your community to make it feel authentic.","# 6.11 Use your own experience","Your personal experience is something AI cannot invent for you. If you have raised broilers, studied agriculture or run a small business, that lived experience should shape every piece of content you publish. AI can help you express the idea clearly, but the idea itself should come from what you know.","# 6.12 Do not become a copy-and-paste creator","Publishing AI text exactly as generated, without review or personal touch, weakens trust over time. Always read the draft, remove anything inaccurate, and add at least one detail that only you could know.","# 6.13 Quality and consistency","An audience trusts creators who post reliable, accurate content on a predictable schedule. It is better to publish three well-checked posts a week than seven rushed ones.","# 6.14 Improve existing content","You can use AI to strengthen content you already have. Ask: “Review this post and suggest three ways to make it clearer.” Compare the suggestions with your own judgment before changing anything.","# 6.15 Build a simple content system","A content system might include a list of topic ideas, a weekly calendar, a set of caption templates and a folder of drafts to review. This turns content creation from a random activity into a repeatable process.","# 6.16 Nigerian content examples","Content that reflects local language, currency and everyday situations tends to connect better with a Nigerian audience. For example, prefer “How to save money on chicken feed in Kano markets” over a generic, unlocalized example.","# 6.17 A 7-day content challenge","Day 1: write one caption. Day 2: draft one educational post. Day 3: script one short video. Day 4: improve a previous post. Day 5: build your weekly calendar. Day 6: publish one piece of content. Day 7: review what worked and what did not.","# 6.18 Content creation checklist","Before publishing, ask: Is the information accurate? Does it reflect my own voice? Is the language simple and clear? Would my audience find this useful? Have I checked for mistakes?","# 6.19 Key lessons","Good content starts with a real idea, not an empty prompt. AI can speed up drafting, but your experience, honesty and consistency are what build a real audience."];HA[5].full=["Ƙirƙirar abun ciki na nufin samar da abu mai amfani ko mai daɗi ga masu kallo ko karatu: rubutun Facebook, rubutun WhatsApp, scripts na TikTok, labaran ilimi, taken kaya, gajerun bidiyo, hotuna da gabatarwa. AI na iya taimakawa wajen hanzarta sassa da yawa na aikin.","# 6.1 Fara da ra'ayinka","Kada ka fara da tambaya “Ba ni abin da zan wallafa.” Fara da ra'ayi, sannan ka yi amfani da AI don bunƙasa shi da gyara shi. Misali, idan ka riga ka san manoma a yankinka na wahala wajen lokacin sanya taki, ka fara daga wannan hakikanin abin da ka lura, sannan ka roƙi AI ya taimaka maka ka mai da shi rubutu.","# 6.2 Ƙirƙirar taken rubutun social media","Taken rubutu ya kamata ya zama gajere, bayyananne kuma ya ba mai karatu dalilin ci gaba da karantawa. Ka ce: “Rubuta gajerun taken Facebook uku game da fa'idodin takin gargajiya ga ƙananan manoma.” Zaɓi wanda ya fi kama da muryarka, ka daidaita kalmomin kafin ka wallafa.","# 6.3 Abun ciki na Facebook","Facebook na dacewa da dogayen rubutun ilimi, tattaunawar al'umma da gina shafi kan batu bayyananne. Ka roƙi AI ya rubuta daftarin rubutun bayani, sannan ka ƙara misalanka, hotuna da bayanan gida don kada ya zama kamar labari na gama-gari.","# 6.4 Abun ciki na WhatsApp","Abun ciki na WhatsApp yawanci ya fi gajarta da kusanci, ana raba shi a rukunoni ko jerin watsawa. Ka roƙi AI ya ba ka gajeren shawara na yau da kullum, bayani mai sauƙi da misali ɗaya, ko saƙon tunatarwa na abokantaka. Ka rage saƙonni, domin mutane kan karanta su da sauri a ƙaramin allo.","# 6.5 TikTok da gajerun bidiyo","Gajerun bidiyo na buƙatar sakan uku na farko masu ƙarfi, ra'ayi ɗaya bayyananne da kira mai sauƙi zuwa aiki. Ka ce: “Rubuta script na TikTok na daƙiƙa 30 da ke bayyana kuskure ɗaya da sababbin manoman kaji ke yawan yi.” Ka gwada faɗin script ɗin da murya kafin ka ɗauka, don ya yi kamar magana ta halitta ba karatu ba.","# 6.6 Mai da ra'ayi ɗaya abun ciki da yawa","Ra'ayi ɗaya na iya zama rubutu da yawa a dandali daban-daban. Misali, darasi ɗaya kan riƙe bayanan noman kaji na iya zama rubutun Facebook, shawarar WhatsApp, script na TikTok da slide na gabatarwa. Ka roƙi AI: “Ɗauki wannan ra'ayi ɗaya ka mai da shi rubutun Facebook, saƙon WhatsApp da gajeren script na bidiyo.”","# 6.7 Ƙirƙiri jadawalin abun ciki na mako","Tsara gaba na rage damuwa kuma yana sa shafinka ya ci gaba da aiki. Ka ce: “Ƙirƙiri jadawalin abun ciki mai sauƙi na kwana bakwai don shafi kan fasahar dijital ga mafari.” Ka daidaita shi da lokacin da kake da shi kowace rana.","# 6.8 Bunƙasa ra'ayoyin gani","AI na iya taimaka maka wajen bayyana abin da hoto ko zane ya kamata ya nuna, ko da kai ne za ka yi zanen a wata manhaja. Misali: “Bayyana zane mai sauƙi da ke kwatanta takin gargajiya da na zamani a hoto ɗaya.” Yi amfani da bayanin a matsayin jagora lokacin da kake zana a kayan aiki kamar Canva.","# 6.9 Tsara bidiyo","Kafin ɗauka, ka tsara tsarin bidiyon. Ka roƙi AI ya zayyana buɗewar da za ta jawo hankali, muhimmin batu, misali ɗaya mai amfani da gajeren saƙon rufewa. Tsari bayyananne na adana lokacin ɗauka kuma yana sa bidiyo ya mai da hankali.","# 6.10 Ƙirƙirar abun ciki na ilimi","Abun ciki na ilimi na gina amana domin yana taimaka wa masu kallo warware matsala ta gaske. Ka ce: “Bayyana fa'ida ɗaya mai amfani ta AI ga masu ƙananan sana'o'i masu jin Hausa, da harshe mai sauƙi.” Ƙara misalanka daga al'ummarka don ya zama na gaske.","# 6.11 Yi amfani da abin da ka fuskanta","Abin da ka fuskanta a rayuwa abu ne da AI ba zai iya ƙirƙira maka ba. Idan ka yi kiwon kaji, ka karanta noma ko ka gudanar da ƙaramar sana'a, wannan ƙwarewa ya kamata ta tsara kowane abun ciki da ka wallafa. AI na iya taimaka maka bayyana ra'ayin a fili, amma ra'ayin kansa ya kamata ya fito daga abin da ka sani.","# 6.12 Kada ka zama mai kwafi-da-liƙawa","Wallafa rubutun AI kamar yadda aka ƙirƙira shi ba tare da dubawa ko ƙarin abu naka ba na raunana amana a kan lokaci. Kullum ka karanta daftarin, ka cire duk abin da bai daidai ba, ka ƙara aƙalla bayani ɗaya da kai kaɗai za ka iya sani.","# 6.13 Inganci da dagewa","Masu kallo na amincewa da masu ƙirƙira da ke wallafa abun ciki amintacce kuma daidai a lokaci da za a iya hasashe. Ya fi kyau ka wallafa rubutu uku da aka duba sosai a mako fiye da bakwai da aka yi cikin gaggawa.","# 6.14 Inganta abun ciki da ake da shi","Za ka iya amfani da AI wajen ƙarfafa abun ciki da kake da shi. Ka ce: “Duba wannan rubutu ka ba da hanyoyi uku na ƙara bayyana shi.” Ka kwatanta shawarwarin da hukuncinka kafin ka canza wani abu.","# 6.15 Gina tsarin abun ciki mai sauƙi","Tsarin abun ciki na iya haɗawa da jerin ra'ayoyin batutuwa, jadawalin mako, samfuran taken rubutu da babban fayil na daftarin da za a duba. Wannan na mai da ƙirƙirar abun ciki daga aiki na bazuwar zuwa tsari mai maimaituwa.","# 6.16 Misalan abun ciki na Najeriya","Abun ciki da ke nuna harshen gida, kuɗi da yanayin rayuwar yau da kullum na kai wa masu kallo na Najeriya sosai. Misali, ka fi son “Yadda ake rage kuɗin abincin kaji a kasuwannin Kano” maimakon misali na gama-gari da bai shafi wuri ba.","# 6.17 Ƙalubalen abun ciki na kwana 7","Rana ta 1: rubuta taken rubutu ɗaya. Rana ta 2: rubuta daftarin rubutun ilimi ɗaya. Rana ta 3: rubuta script na gajeren bidiyo ɗaya. Rana ta 4: inganta rubutun da ya wuce. Rana ta 5: gina jadawalin makonka. Rana ta 6: wallafa abun ciki ɗaya. Rana ta 7: duba abin da ya yi aiki da wanda bai yi ba.","# 6.18 Jerin dubawa na ƙirƙirar abun ciki","Kafin ka wallafa, ka tambaya: Bayanin daidai ne? Yana nuna muryata? Harshen mai sauƙi ne kuma bayyananne? Masu kallo za su ga yana da amfani? Na duba kurakurai?","# 6.19 Muhimman darussa","Abun ciki mai kyau na farawa da ra'ayi na gaske, ba prompt fanko ba. AI na iya hanzarta rubuta daftari, amma ƙwarewarka, gaskiyarka da dagewarka ne ke gina masu kallo na gaske."];
CH[6].full=["Many people hope AI will bring instant income. In reality, AI is a tool that increases what you can offer. It does not replace the need for a real skill and a real customer.","# 7.1 AI is not automatic income","Simply having access to ChatGPT does not create income by itself. Income comes from solving a problem for someone who is willing to pay for the solution.","# 7.2 People pay for useful results","Customers pay for outcomes: a clear document, an attractive design, a working translation, a well-written caption. AI can help you produce the outcome faster, but the value is still in the result.","# 7.3 The Skill + AI + Problem + Customer formula","Skill + AI + Problem + Customer = Income. Identify a skill you already have, use AI to work faster, find a real problem, and find someone who needs it solved.","# 7.4 Writing and editing services","You can offer to write or edit business messages, articles, social-media captions and simple reports. Use AI to draft quickly, then edit carefully before delivering.","# 7.5 Social-media content services","Small businesses often need help managing their online presence. You could offer a monthly package of captions, post ideas and a simple content calendar, produced with AI assistance and reviewed by you.","# 7.6 CV and application support","Many job seekers need a clearer CV or application letter. Ask AI to help structure the document, then personalize it with the person's real experience and achievements.","# 7.7 Graphic design services","Combine AI-generated ideas and text with a design tool such as Canva to produce flyers, posters and social-media graphics for local businesses.","# 7.8 Short-video services","Offer to script and plan short videos for businesses or individuals who want to grow their online presence but do not know where to start.","# 7.9 Tutoring and learning support","If you understand a subject well, AI can help you prepare explanations, practice questions and study plans for people you tutor.","# 7.10 Translation and language services","If you are fluent in more than one language, such as Hausa and English, AI can help you produce first-draft translations, which you then check and correct for accuracy and tone.","# 7.11 Research and organization services","Offer to gather and organize information for busy clients: summarizing reports, organizing notes or preparing simple briefing documents.","# 7.12 Product descriptions","Help small businesses turn basic product details into clear, appealing descriptions for their online stores or social pages.","# 7.13 Customer-service templates","Prepare ready-made, polite response templates for a business's most common customer questions.","# 7.14 Presentations and business documents","Use AI to help structure slide decks, proposals and simple business documents for clients who need a professional look quickly.","# 7.15 Combine AI with your existing skills","Your background gives you an advantage. An agricultural student can offer AI-assisted extension materials; a tailor can offer AI-assisted product descriptions and captions.","# 7.16 Build a small portfolio","Create two or three sample pieces of work, even without a paying client at first, to show potential customers what you can do."];HA[6].full=["Mutane da yawa na fatan AI zai kawo kuɗi nan take. A gaskiya, AI kayan aiki ne da ke ƙara abin da za ka iya bayarwa. Ba ya maye gurbin buƙatar fasaha ta gaske da kwastoma na gaske.","# 7.1 AI ba kuɗi ba ne ta atomatik","Samun ChatGPT kawai ba ya samar da kuɗi da kansa. Kuɗi na zuwa ne daga warware wa wani matsala wanda ke shirye ya biya kuɗin maganin.","# 7.2 Mutane na biyan sakamako mai amfani","Kwastomomi na biyan sakamako: takarda bayyananna, zane mai kyau, fassara mai aiki, taken rubutu da aka rubuta da kyau. AI na iya taimaka maka ka samar da sakamakon da sauri, amma daraja tana cikin sakamakon.","# 7.3 Tsarin Fasaha + AI + Matsala + Kwastoma","Fasaha + AI + Matsala + Kwastoma = Kuɗi. Gano fasahar da kake da ita, yi amfani da AI don yin aiki da sauri, nemo matsala ta gaske, ka nemo wanda yake buƙatar a warware ta.","# 7.4 Hidimar rubutu da gyara","Za ka iya ba da hidimar rubuta ko gyara saƙonnin kasuwanci, labarai, taken rubutun social media da rahotanni masu sauƙi. Yi amfani da AI don rubuta daftari da sauri, sannan ka gyara a hankali kafin ka isar.","# 7.5 Hidimar abun ciki na social media","Ƙananan sana'o'i na yawan buƙatar taimako wajen kula da bayyanarsu a intanet. Za ka iya ba da kunshin wata-wata na taken rubutu, ra'ayoyin rubutu da jadawalin abun ciki mai sauƙi, wanda aka samar da taimakon AI kuma ka duba.","# 7.6 Taimakon CV da takardun neman aiki","Masu neman aiki da yawa na buƙatar CV ko wasiƙar neman aiki mafi bayyana. Ka roƙi AI ya taimaka wajen tsara takardar, sannan ka daidaita ta da ainihin ƙwarewa da nasarorin mutumin.","# 7.7 Hidimar zane","Haɗa ra'ayoyi da rubutun da AI ya samar da kayan zane kamar Canva don yin fosta, takardun talla da zanen social media ga sana'o'in gida.","# 7.8 Hidimar gajerun bidiyo","Ba da hidimar rubuta script da tsara gajerun bidiyo ga kasuwanci ko mutane da ke son bunƙasa a intanet amma ba su san ta inda za su fara ba.","# 7.9 Koyarwa da tallafin koyo","Idan ka fahimci wani fanni sosai, AI na iya taimaka maka ka shirya bayani, tambayoyin gwaji da tsarin karatu ga waɗanda kake koyarwa.","# 7.10 Fassara da hidimar harshe","Idan kana iya harsuna fiye da ɗaya, kamar Hausa da Turanci, AI na iya taimaka maka wajen samar da daftarin fassara na farko, sannan ka duba ka gyara don daidaito da salo.","# 7.11 Hidimar bincike da tsara bayanai","Ba da hidimar tattara da tsara bayanai ga abokan ciniki masu aiki: taƙaita rahotanni, tsara bayanan rubutu ko shirya takardun bayani masu sauƙi.","# 7.12 Bayanin kaya","Taimaka wa ƙananan sana'o'i su mai da bayanan kaya na yau da kullum bayani mai bayyana kuma mai jan hankali don shagunansu na intanet ko shafukan social media.","# 7.13 Samfuran hidimar kwastomomi","Shirya samfuran amsa masu ladabi da aka riga aka shirya ga tambayoyin kwastomomi mafi yawa na wani kasuwanci.","# 7.14 Gabatarwa da takardun kasuwanci","Yi amfani da AI don taimakawa wajen tsara slides, shawarwarin aiki da takardun kasuwanci masu sauƙi ga abokan ciniki da ke buƙatar kamanni na ƙwararru da sauri.","# 7.15 Haɗa AI da fasahohin da kake da su","Asalinka na ba ka fifiko. Ɗalibin noma na iya ba da kayan faɗaɗa noma da AI ya taimaka; ɗinki na iya ba da bayanin kaya da taken rubutu da AI ya taimaka.","# 7.16 Gina ƙaramin samfuran aiki (portfolio)","Ƙirƙiri samfuran aiki biyu ko uku, ko da ba ka da kwastoma mai biya tukuna, don nuna wa masu son ka abin da za ka iya yi."];
CH[6].full.push(...["# 7.17 Start with a small paid project","Rather than waiting for a big client, start with one small, affordable project to build experience, confidence and a first testimonial.","# 7.18 AI ethics and privacy when earning with AI","Never submit a client's private, confidential or identifying information into an AI system without their permission.","# 7.19 Be honest about your work","Tell clients clearly what part of the work involves AI assistance, especially in fields where this matters, such as academic or legal writing.","# 7.20 Protect customer information","Treat customer data (names, numbers, financial details) with the same care you would want for your own information.","# 7.21 Do not create false information","Never use AI to generate fake reviews, false certificates, invented statistics or misleading claims for a client.","# 7.22 Respect other people's work","Do not present someone else's writing, design or ideas as your own, even if AI helped you copy or rephrase them.","# 7.23 Review before delivery","Always check AI-generated work for accuracy, tone and errors before sending it to a client.","# 7.24 Choosing a customer type","Start with customers you understand well, for example small businesses in your own community, or students facing challenges you have already overcome.","# 7.25 Simple pricing principles","Base your price on the value delivered and the time involved, not only on what AI itself costs, which is often very low.","# 7.26 Example service package","For example: “Basic Social Media Package: 4 captions, 1 content calendar, and 2 customer-response templates per month.”","# 7.27 A 30-day AI income-building plan","Use the first ten days to build sample work, the next ten days to reach out to potential customers, and the final ten days to deliver your first paid project and gather feedback.","# 7.28 Avoid easy-money claims","Be cautious of anyone who promises guaranteed income from AI with no real skill or effort involved.","# 7.29 The beginner rule","Start small, deliver honestly, and let your reputation grow through real results rather than exaggerated promises.","# 7.30 Income pathway","A realistic pathway is: Learn a skill → Practise with AI → Build samples → Find one customer → Deliver well → Ask for referrals → Grow slowly.","# 7.31 Key lessons","AI can help you work faster and offer more services, but income still depends on a real skill, honest delivery and a real customer relationship."]);HA[6].full.push(...["# 7.17 Fara da ƙaramin aiki mai biya","Maimakon jiran babban kwastoma, ka fara da ƙaramin aiki ɗaya mai araha don gina ƙwarewa, ƙwarin gwiwa da shaidar farko.","# 7.18 Da'a da sirri wajen samun kuɗi da AI","Kada ka taɓa saka bayanan sirri ko waɗanda ke gane kwastoma cikin tsarin AI ba tare da izininsa ba.","# 7.19 Ka yi gaskiya game da aikinka","Gaya wa kwastomomi a fili wane ɓangare na aikin ya ƙunshi taimakon AI, musamman a fannonin da hakan ke da muhimmanci, kamar rubutun ilimi ko na doka.","# 7.20 Kare bayanan kwastomomi","Kula da bayanan kwastomomi (sunaye, lambobi, bayanan kuɗi) kamar yadda kake so a kula da naka bayanan.","# 7.21 Kada ka ƙirƙiri bayanan ƙarya","Kada ka taɓa amfani da AI wajen ƙirƙirar ra'ayoyin ƙarya, takardun shaida na ƙarya, ƙididdiga na ƙirƙira ko da'awar ruɗarwa ga kwastoma.","# 7.22 Girmama aikin wasu","Kada ka gabatar da rubutu, zane ko ra'ayin wani a matsayin naka, ko da AI ya taimaka maka ka kwafa ko sake bayyana shi.","# 7.23 Duba kafin isarwa","Kullum ka duba aikin da AI ya samar don daidaito, salo da kurakurai kafin ka aika wa kwastoma.","# 7.24 Zaɓar nau'in kwastoma","Fara da kwastomomin da ka fahimta sosai, misali ƙananan sana'o'i a al'ummarka, ko ɗalibai masu fuskantar ƙalubalen da kai ka riga ka shawo kansu.","# 7.25 Ƙa'idojin farashi masu sauƙi","Ka kafa farashinka a kan darajar da ka bayar da lokacin da aka kashe, ba kawai kan abin da AI kansa ke kashewa ba, wanda yawanci kaɗan ne.","# 7.26 Misalin kunshin hidima","Misali: “Kunshin Social Media na Asali: taken rubutu 4, jadawalin abun ciki 1, da samfuran amsar kwastomomi 2 a wata.”","# 7.27 Tsarin gina kuɗi da AI na kwana 30","Yi amfani da kwana goma na farko wajen gina samfuran aiki, kwana goma na gaba wajen tuntuɓar kwastomomi masu yiwuwa, da kwana goma na ƙarshe wajen isar da aikinka na farko mai biya da tattara ra'ayi.","# 7.28 Ka guji da'awar kuɗi cikin sauƙi","Ka yi hattara da duk wanda ya yi alƙawarin tabbataccen kuɗi daga AI ba tare da fasaha ta gaske ko ƙoƙari ba.","# 7.29 Ƙa'idar mafari","Ka fara ƙarami, ka isar da aiki da gaskiya, ka bar sunanka ya bunƙasa ta hanyar sakamako na gaske ba alƙawura na ƙari ba.","# 7.30 Hanyar samun kuɗi","Hanya mai yiwuwa ita ce: Koyi fasaha → Gwada da AI → Gina samfura → Nemo kwastoma ɗaya → Isar da kyau → Nemi shawarwari daga wasu → Bunƙasa a hankali.","# 7.31 Muhimman darussa","AI na iya taimaka maka ka yi aiki da sauri kuma ka ba da hidimomi da yawa, amma samun kuɗi na dogara ne da fasaha ta gaske, isar da aiki da gaskiya da dangantaka ta gaske da kwastoma."]);
CH[7].full=["Using AI often is not the same as using AI well. This chapter focuses on becoming genuinely effective, not just active.","# 8.1 Chapter roadmap","This chapter looks at common mistakes, better habits, and a simple system for improving your AI use over time.","# 8.2 Avoid common AI mistakes","Common mistakes include accepting the first answer without checking it, giving vague instructions, and sharing private information unnecessarily.","# 8.3 Learn from your mistakes","When an AI result disappoints you, ask what was missing from your instructions, and adjust your next prompt accordingly.","# 8.4 Use a prompt pattern","A reliable pattern is Task + Context + Audience + Format + Requirements. Reuse this structure across many different tasks.","# 8.5 Ask AI to improve your work","Beyond generating new content, ask AI to review something you already wrote and suggest specific improvements.","# 8.6 Ask AI not to invent information","Add instructions such as “Do not invent facts or statistics. Say if you are not sure” for anything factual.","# 8.7 Make your English simpler","If a response feels too complex, ask AI to simplify it, or to explain it as though to a beginner.","# 8.8 Keep your own thinking","Before accepting an AI answer, briefly consider whether it truly matches your own understanding of the situation.","# 8.9 Use fewer tools more effectively","Rather than trying every new AI application, become skilled with one or two tools you use regularly.","# 8.10 Build a personal AI workflow","Develop a repeatable process: plan the task, write the prompt, review the draft, revise and finalize.","# 8.11 Apply AI to real problems","Effectiveness grows fastest when you apply AI to problems you genuinely face, not only to practice exercises.","# 8.12 Combine AI with existing skills","The most effective AI users are not the most technical. They are the ones who combine AI with strong existing knowledge in their own field.","# 8.13 Create a small portfolio","Keep examples of your best AI-assisted work, so you can reuse successful approaches and show your capability to others.","# 8.14 Track your results","Notice which prompts and approaches consistently produce useful results, and which do not.","# 8.15 Do not measure success only by speed","Producing content quickly is not valuable if the content is inaccurate, generic or unhelpful.","# 8.16 7-day AI improvement challenge","Day 1: identify one weak habit. Day 2: rewrite one prompt using the Task + Context + Audience + Format pattern. Day 3: ask AI to critique your own work. Day 4: simplify one explanation. Day 5: apply AI to a real personal task. Day 6: review your results honestly. Day 7: write down what you will keep doing.","# 8.17 Practical prompts for becoming better with AI","Try “Point out any weaknesses in this plan before I continue” or “Ask me three clarifying questions before answering.”","# 8.18 Build a personal AI rulebook","Write down your own short list of rules, such as never sharing passwords, always checking factual claims, and always reviewing before sending work to others.","# 8.19 The effective AI user","An effective AI user is patient, checks their work, protects information, and keeps improving their own skills alongside their AI use.","# 8.20 Key lessons","Effectiveness comes from good habits, not from using AI constantly. Slow down enough to check, reflect and improve."];HA[7].full=["Amfani da AI akai-akai ba daidai yake da amfani da shi da kyau ba. Wannan babi na mai da hankali kan zama mai amfani da gaske, ba kawai mai aiki ba.","# 8.1 Taswirar babi","Wannan babi na duba kura-kuran da ake yawan yi, ingantattun halaye da tsari mai sauƙi na inganta amfani da AI a kan lokaci.","# 8.2 Guji kura-kuran AI na yau da kullum","Kura-kuran da ake yawan yi sun haɗa da karɓar amsar farko ba tare da dubawa ba, ba da umarni marasa haske, da bayyana bayanan sirri ba tare da buƙata ba.","# 8.3 Koyi daga kura-kuranka","Idan sakamakon AI bai yi maka daɗi ba, ka tamba
